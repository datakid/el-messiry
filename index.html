<style>
:root{
  --r:18px; --r-sm:10px;
  --font-ui:"Readex Pro","Inter",system-ui,sans-serif;
  --paper-w:210mm; --paper-h:297mm; --pad:16mm; --fit:1;
}
html[data-theme="linen"]{ --bg:#F6F1EA; --paper:#FFFDF9; --ink:#3A322B; --soft:#8A7D70; --accent:#B8674A; --tint:#F4E6DC; --line:#EADFD3; --accent2:#7E9C8A; }
html[data-theme="sage"] { --bg:#EEF2EC; --paper:#FBFCF9; --ink:#2F3A33; --soft:#76857A; --accent:#5E8A6E; --tint:#E1EBE2; --line:#DCE5DB; --accent2:#C49A6C; }
html[data-theme="mist"] { --bg:#EDF1F6; --paper:#FBFCFE; --ink:#2C3442; --soft:#7A8699; --accent:#5877A8; --tint:#E1E8F3; --line:#DDE3EC; --accent2:#C98B8B; }
html[data-theme="blush"]{ --bg:#F7EEF0; --paper:#FFFBFC; --ink:#43333A; --soft:#94808A; --accent:#B0607A; --tint:#F4E1E7; --line:#EEDDE2; --accent2:#8C8FB8; }
html[data-theme="lilac"]{ --bg:#F1EFF7; --paper:#FCFBFF; --ink:#35304A; --soft:#847E9C; --accent:#7A68B0; --tint:#E7E3F4; --line:#E2DEEE; --accent2:#6FA3A0; }
html[data-theme="ink"]  { --bg:#F2F2F0; --paper:#FFFFFF; --ink:#1E1E1E; --soft:#6E6E6E; --accent:#1E1E1E; --tint:#EFEFEC; --line:#E0E0DC; --accent2:#9A9A96; }

@media screen{
  html[data-mode="dark"]{color-scheme:dark}
  html[data-mode="dark"][data-theme="linen"]{ --bg:#1B1815; --paper:#25211D; --ink:#EEE5DB; --soft:#A69888; --accent:#E39A7E; --tint:#332A24; --line:#3A322B; --accent2:#9FBDAA; }
  html[data-mode="dark"][data-theme="sage"] { --bg:#151A17; --paper:#1E2521; --ink:#E2EAE3; --soft:#94A499; --accent:#8FBD9F; --tint:#26322B; --line:#2F3A33; --accent2:#D9B58C; }
  html[data-mode="dark"][data-theme="mist"] { --bg:#151920; --paper:#1E232C; --ink:#E1E7F0; --soft:#96A2B5; --accent:#92ADDD; --tint:#262E3B; --line:#2E3644; --accent2:#DEA7A7; }
  html[data-mode="dark"][data-theme="blush"]{ --bg:#1C1518; --paper:#261E22; --ink:#F0E2E7; --soft:#AF98A3; --accent:#E292AC; --tint:#35262D; --line:#3D2E35; --accent2:#ABAED7; }
  html[data-mode="dark"][data-theme="lilac"]{ --bg:#17151E; --paper:#201E2A; --ink:#E8E4F4; --soft:#9E98B7; --accent:#AA9BE0; --tint:#2C283B; --line:#353046; --accent2:#90C5C1; }
  html[data-mode="dark"][data-theme="ink"]  { --bg:#131313; --paper:#1C1C1C; --ink:#EDEDEA; --soft:#9A9A96; --accent:#EDEDEA; --tint:#262626; --line:#333333; --accent2:#8A8A86; }
  html[data-mode="dark"] .paper{box-shadow:0 0 0 1px var(--line),0 24px 60px -30px rgba(0,0,0,.7)}
}

html[data-type="naskh"]{ --f-body:"Noto Naskh Arabic","Inter",serif; --f-head:"Noto Naskh Arabic","Fraunces",serif; }
html[data-type="modern"]{ --f-body:"Readex Pro","Inter",sans-serif; --f-head:"Readex Pro","Inter",sans-serif; }
html[data-type="classic"]{ --f-body:"Amiri","Fraunces",serif; --f-head:"Amiri","Fraunces",serif; }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);min-height:100vh;
  background-image:radial-gradient(circle at 15% 0%,var(--tint),transparent 45%),radial-gradient(circle at 90% 100%,var(--tint),transparent 40%);
  transition:background-color .3s}
button,select,input{font-family:inherit;color:inherit}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
.panel{background:color-mix(in srgb,var(--paper) 80%,transparent);backdrop-filter:blur(10px);border-inline-end:1px solid var(--line);
  padding:1.2rem;display:flex;flex-direction:column;gap:1.1rem;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:.6rem}
.brand-mark{width:34px;height:34px}
.brand b{font-size:1.25rem;letter-spacing:.01em}
.brand small{color:var(--soft);display:block;font-size:.72rem}
.sec{display:flex;flex-direction:column;gap:.5rem}
.sec h3{margin:0;font-size:.72rem;font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.08em}
.row{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:var(--tint);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:.4rem .7rem;border-radius:999px;cursor:pointer;font-size:.8rem;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.08);font-weight:600}
.dd{display:flex;align-items:center;gap:.55rem;width:100%;padding:.6rem .8rem;border:1px solid var(--line);border-radius:12px;background:var(--paper);cursor:pointer;font-size:.86rem;text-align:start;transition:border-color .15s,box-shadow .15s}
.dd:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.dd[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.dd .dd-ico{color:var(--accent)}
.dd .dd-label{flex:1}
.dd .chev{width:15px;height:15px;color:var(--soft);transition:transform .2s}
.dd[aria-expanded="true"] .chev{transform:rotate(180deg)}
.menu{position:fixed;z-index:60;min-width:200px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 22px 44px -20px rgba(0,0,0,.4);padding:.35rem;display:flex;flex-direction:column;gap:1px;max-height:60vh;overflow:auto;
  font-family:var(--font-ui);animation:menuIn .14s ease-out;transform-origin:top}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.menu button{display:flex;align-items:center;gap:.6rem;border:0;background:transparent;padding:.55rem .7rem;border-radius:10px;cursor:pointer;font-size:.86rem;text-align:start;color:inherit}
.menu button svg{width:16px;height:16px;color:var(--soft)}
.menu button:hover,.menu button:focus-visible{background:var(--tint);outline:none}
.menu button[aria-selected="true"]{color:var(--accent);font-weight:600}
.menu button[aria-selected="true"] svg{color:var(--accent)}
.menu .ck{margin-inline-start:auto;opacity:0}
.menu button[aria-selected="true"] .ck{opacity:1}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:.4rem}
.sw{aspect-ratio:1;border-radius:12px;border:2px solid transparent;cursor:pointer;background:linear-gradient(135deg,var(--a) 0 50%,var(--b) 50%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:1px solid var(--line);background:var(--paper);
  border-radius:999px;padding:.55rem .9rem;cursor:pointer;font-size:.83rem;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--paper);border-color:transparent;font-weight:600;width:100%;padding:.8rem}
.btn.primary:hover{filter:brightness(1.07);color:var(--paper)}
.tog{display:flex;align-items:center;justify-content:space-between;font-size:.85rem;gap:.5rem;cursor:pointer}
.tog input{accent-color:var(--accent);width:18px;height:18px}
.hint{font-size:.72rem;color:var(--soft);line-height:1.5}
.fit-note{font-size:.75rem;color:var(--accent);min-height:1em}

.stage{padding:2.5rem 1.5rem 5rem;display:flex;justify-content:center;overflow:auto}
.paper-wrap{direction:ltr;flex:none;overflow:hidden}
.paper{transform-origin:0 0}

.paper{width:var(--paper-w);height:var(--paper-h);background:var(--paper);color:var(--ink);
  border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 24px 60px -30px rgba(60,40,20,.35);
  padding:var(--pad);position:relative;overflow:hidden;font-family:var(--f-body);display:flex;flex-direction:column}
.paper::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 60% at 100% 0%,var(--tint),transparent 60%)}
html[data-decor="off"] .paper::before{display:none}
.content{position:relative;font-size:calc(11.5pt * var(--fit));display:flex;flex-direction:column;gap:1.1em;flex:1}
[contenteditable]{outline:none;border-radius:4px;transition:background .15s}
[contenteditable]:hover{background:color-mix(in srgb,var(--tint) 60%,transparent)}
[contenteditable]:focus{background:var(--tint);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
[contenteditable]:empty::before{content:attr(data-ph);color:var(--soft);opacity:.55}

.hd{display:flex;align-items:center;gap:1em}
.photo{width:4.6em;height:4.6em;border-radius:50%;background:var(--tint);flex:none;overflow:hidden;cursor:pointer;display:grid;place-items:center;color:var(--accent);position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.photo input{display:none}
.hd-text{flex:1;min-width:0}
.eyebrow{display:block;color:var(--accent);font-size:.82em;font-weight:700;letter-spacing:.04em}
.name{display:block;font-family:var(--f-head);font-size:2.1em;font-weight:700;line-height:1.2}
.sub{display:block;color:var(--soft);font-size:1em}
.title-block{text-align:center;padding:.6em 0;border-block:1px solid var(--line)}
.badge{display:inline-block;background:var(--tint);color:var(--accent);border-radius:999px;padding:.15em .9em;font-size:.8em;font-weight:700;margin-bottom:.35em}
.title{display:block;font-family:var(--f-head);font-size:1.75em;font-weight:700}
.note{display:block;color:var(--soft);margin-top:.2em;white-space:pre-wrap}

.groups{display:grid;gap:.8em}
html[data-layout="grid"] .groups{grid-template-columns:1fr 1fr}
.group{border:1px solid var(--line);border-radius:14px;padding:.8em 1em;background:color-mix(in srgb,var(--paper) 70%,var(--tint));break-inside:avoid}
.g-head{display:flex;align-items:center;gap:.5em;margin-bottom:.45em}
.g-label{flex:1;font-weight:700;color:var(--accent);font-size:1.05em}
.slots{display:flex;flex-direction:column;gap:.3em}
.slot{display:flex;align-items:baseline;gap:.6em;padding:.25em 0;border-bottom:1px dashed var(--line)}
.slot:last-child{border-bottom:0}
.time{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;unicode-bidi:isolate}
.dash{color:var(--soft)}
.s-note{flex:1;color:var(--soft);font-size:.92em}
.full{font-size:.72em;font-weight:700;color:var(--paper);background:var(--accent2);border-radius:999px;padding:.1em .6em;border:0;cursor:pointer}
.full.off{background:transparent;color:var(--soft);border:1px dashed var(--line)}

.freeform{white-space:pre-wrap;line-height:1.7;padding:.7em 1em;border-inline-start:3px solid var(--accent2);background:color-mix(in srgb,var(--tint) 45%,transparent);border-radius:0 10px 10px 0}
[dir="rtl"] .freeform{border-radius:10px 0 0 10px}

.bottom{margin-top:auto;display:flex;align-items:flex-end;gap:1em;padding-top:.8em;border-top:1px solid var(--line)}
.contacts{flex:1;display:flex;flex-wrap:wrap;gap:.45em}
.chip{display:inline-flex;align-items:center;gap:.4em;background:var(--tint);border-radius:999px;padding:.3em .8em;font-size:.92em}
.chip svg{width:1em;height:1em;color:var(--accent)}
.ctype{border:0;background:transparent;padding:.15em;margin:-.15em;border-radius:50%;color:var(--accent);cursor:pointer;display:inline-grid;place-items:center}
.ctype:hover,.ctype[aria-expanded="true"]{background:color-mix(in srgb,var(--accent) 16%,transparent)}
html.clean .ctype{pointer-events:none}
.chip .val{unicode-bidi:isolate;direction:ltr}
.footer-text{display:block;color:var(--soft);font-size:.82em;margin-top:.4em;width:100%}
.qr{width:6.2em;height:6.2em;flex:none;background:#fff;padding:.3em;border-radius:8px}
.qr svg{width:100%;height:100%;display:block}

.ed{border:0;background:transparent;color:var(--soft);cursor:pointer;border-radius:50%;width:1.7em;height:1.7em;display:inline-grid;place-items:center;opacity:.5;padding:0}
.ed:hover{opacity:1;color:var(--accent);background:var(--tint)}
.ed svg{width:1em;height:1em}
.add{border:1px dashed color-mix(in srgb,var(--accent) 40%,transparent);background:transparent;color:var(--accent);border-radius:999px;padding:.25em .9em;font-size:.8em;cursor:pointer;align-self:flex-start;display:inline-flex;gap:.3em;align-items:center}
.add:hover{background:var(--tint)}
.add svg{width:1em;height:1em}
html.clean .ed, html.clean .add{display:none}

.toast{position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--paper);padding:.6rem 1.1rem;border-radius:999px;font-size:.85rem;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .panel{position:static;height:auto;border-inline-end:0;border-bottom:1px solid var(--line)}
  .stage{padding:1rem .5rem 3rem}
}

@media print{
  html,body{background:none!important}
  .panel,.toast{display:none!important}
  .app{display:block}
  .stage{padding:0;overflow:visible}
  .paper-wrap{width:auto!important;height:auto!important}
  .paper{transform:none!important}
  .paper{box-shadow:none;border-radius:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ed,.add,.empty-print,.full.off,.chip.empty,.menu{display:none!important}
  [contenteditable]{background:none!important;box-shadow:none!important}
  [contenteditable]:empty{display:none!important}
  html[data-ink="saver"] .paper{--tint:#fff;--accent:#222;--accent2:#555;--soft:#555;--line:#bbb;background:#fff}
  html[data-ink="saver"] .paper::before{display:none}
}
</style>
<style id="pageRule"></style>
</head>

      <b data-t="brand"></b>
    </div>

    <section class="sec"><h3 data-t="sType"></h3><button class="dd" id="preset" type="button" aria-haspopup="listbox" aria-expanded="false"><svg class="i dd-ico"><use href="#i-tag"/></svg><span class="dd-label" id="presetLabel"></span><svg class="i chev"><use href="#i-chev"/></svg></button></section>
    <section class="sec"><h3 data-t="sTheme"></h3><div class="swatches" id="swatches"></div>
      <div class="seg" id="modeSeg"><button data-v="auto"><svg class="i" style="width:14px;height:14px;vertical-align:-2px"><use href="#i-auto"/></svg> <span data-t="mAuto"></span></button><button data-v="light"><svg class="i" style="width:14px;height:14px;vertical-align:-2px"><use href="#i-sun"/></svg> <span data-t="mLight"></span></button><button data-v="dark"><svg class="i" style="width:14px;height:14px;vertical-align:-2px"><use href="#i-moon"/></svg> <span data-t="mDark"></span></button></div></section>
    <section class="sec"><h3 data-t="sFont"></h3>

    <section class="sec"><h3 data-t="sLayout"></h3>

<script>
'use strict';
const T = {
  ar:{brand:'لوحة',mAuto:'تلقائي',mLight:'فاتح',mDark:'داكن',sType:'نوع الإعلان',sTheme:'اللون',sFont:'الخط',sLayout:'التخطيط',list:'قائمة',grid:'عمودان',
      decor:'زخرفة ناعمة',freeform:'فقرة نص حر',qrTog:'رمز QR',sPaper:'الورق والطباعة',portrait:'طولي',landscape:'عرضي',inkSaver:'توفير الحبر',
      clean:'إخفاء أدوات التحرير',sLang:'اللغة والأرقام',print:'طباعة',export:'حفظ',import:'فتح',reset:'جديد',
      hint:'انقر على أي نص لتعديله مباشرة. ما تراه على الورقة هو ما سيُطبع تماماً. في نافذة الطباعة اختر «بدون هوامش» وفعّل «رسومات الخلفية».',
      name:'الاسم',sub:'الصفة أو التخصص',eyebrow:'عنوان صغير',badge:'شارة',title:'عنوان الإعلان',note:'ملاحظة أسفل العنوان',group:'اسم المجموعة',
      sNote:'ملاحظة',addGroup:'إضافة مجموعة',addSlot:'إضافة موعد',addContact:'تواصل',full:'مكتمل',freePh:'اكتب هنا أي تفاصيل: الأسعار، الشروط، الملاحظات…',
      footer:'نص ختامي',fitted:p=>`صُغّر الخط إلى ${p}% ليتسع في صفحة واحدة`,saved:'تم الحفظ',imported:'تم الفتح',bad:'ملف غير صالح',confirm:'مسح كل المحتوى والبدء من جديد؟',
      am:'ص',pm:'م'},
  en:{brand:'Lawha',mAuto:'System',mLight:'Light',mDark:'Dark',sType:'Announcement type',sTheme:'Colour',sFont:'Typeface',sLayout:'Layout',list:'List',grid:'Two columns',
      decor:'Soft decoration',freeform:'Free-text paragraph',qrTog:'QR code',sPaper:'Paper & print',portrait:'Portrait',landscape:'Landscape',inkSaver:'Ink saver',
      clean:'Hide editing controls',sLang:'Language & digits',print:'Print',export:'Save',import:'Open',reset:'New',
      hint:'Click any text to edit it in place. The sheet you see is exactly what prints. In the print dialog choose "Margins: none" and enable "Background graphics".',

      am:'AM',pm:'PM'}
};
const PRESETS = {
  tutor:{ar:'مدرّس خصوصي',en:'Private tutor',g:{ar:'المجموعة',en:'Group'},t:{ar:'مواعيد المجموعات',en:'Group Schedule'}},
  clinic:{ar:'عيادة',en:'Clinic',g:{ar:'اليوم',en:'Day'},t:{ar:'مواعيد الكشف',en:'Consultation Hours'}},
  gym:{ar:'نادي رياضي',en:'Gym',g:{ar:'اليوم',en:'Day'},t:{ar:'جدول الحصص',en:'Class Timetable'}},
  shop:{ar:'محل / مطعم',en:'Shop / restaurant',g:{ar:'اليوم',en:'Day'},t:{ar:'مواعيد العمل',en:'Opening Hours'}},
  event:{ar:'برنامج فعالية',en:'Event programme',g:{ar:'الجلسة',en:'Session'},t:{ar:'برنامج اليوم',en:"Today's Programme"}},
  course:{ar:'كورس',en:'Course',g:{ar:'الأسبوع',en:'Week'},t:{ar:'خطة الكورس',en:'Course Plan'}},
  prayer:{ar:'مواقيت الصلاة',en:'Prayer times',g:{ar:'الصلاة',en:'Prayer'},t:{ar:'مواقيت الصلاة',en:'Prayer Times'}}
};
const THEMES = {linen:['#F4E6DC','#B8674A'],sage:['#E1EBE2','#5E8A6E'],mist:['#E1E8F3','#5877A8'],blush:['#F4E1E7','#B0607A'],lilac:['#E7E3F4','#7A68B0'],ink:['#EFEFEC','#1E1E1E']};
const PAPER = {A4:[210,297],A5:[148,210],Letter:[215.9,279.4]};
const CONTACTS = {whatsapp:['i-whatsapp',{ar:'واتساب',en:'WhatsApp'}],phone:['i-phone',{ar:'هاتف',en:'Phone'}],mail:['i-mail',{ar:'بريد',en:'Email'}],
  pin:['i-pin',{ar:'العنوان',en:'Address'}],insta:['i-insta',{ar:'إنستغرام',en:'Instagram'}],link:['i-link',{ar:'موقع',en:'Website'}]};
const KEY = 'lawha:v2';

const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L = () => T[S.lang];
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
const SEGS = {modeSeg:'mode',fontSeg:'font',layoutSeg:'layout',paperSeg:'paper',orientSeg:'orient',langSeg:'lang',numSeg:'numerals',clockSeg:'clock'};

let openDD = null;
function closeMenu(focusBack){
  if(!openDD) return; const {menu,anchor}=openDD; openDD=null;
  menu.remove(); anchor.setAttribute('aria-expanded','false'); if(focusBack) anchor.focus();
}
function openMenu(anchor, items, current, onPick){
  if(openDD && openDD.anchor===anchor){ closeMenu(true); return; }
  closeMenu();
  const menu=document.createElement('div'); menu.className='menu'; menu.setAttribute('role','listbox'); menu.dir=document.documentElement.dir;
  menu.innerHTML=items.map(it=>`<button type="button" role="option" data-v="${it.v}" aria-selected="${it.v===current}">${it.icon?`<svg class="i"><use href="#${it.icon}"/></svg>`:''}<span>${esc(it.label)}</span><svg class="i ck"><use href="#i-check"/></svg></button>`).join('');
  document.body.appendChild(menu);
  const r=anchor.getBoundingClientRect(), mw=Math.max(menu.offsetWidth, anchor.classList.contains('dd')?r.width:0);
  menu.style.minWidth=mw+'px';
  const rtl=menu.dir==='rtl';
  let left = rtl ? r.right-mw : r.left; left=Math.max(8,Math.min(left,innerWidth-mw-8));
  let top = r.bottom+6; if(top+menu.offsetHeight>innerHeight-8) top=Math.max(8,r.top-menu.offsetHeight-6);
  Object.assign(menu.style,{left:left+'px',top:top+'px'});
  anchor.setAttribute('aria-expanded','true');
  openDD={menu,anchor};
  const opts=[...menu.querySelectorAll('button')];
  (opts.find(o=>o.getAttribute('aria-selected')==='true')||opts[0]).focus();
  menu.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; closeMenu(true); onPick(b.dataset.v); });
  menu.addEventListener('keydown',e=>{
    const i=opts.indexOf(document.activeElement);
    if(e.key==='ArrowDown'){ e.preventDefault(); opts[(i+1)%opts.length].focus(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); opts[(i-1+opts.length)%opts.length].focus(); }
    else if(e.key==='Home'){ e.preventDefault(); opts[0].focus(); }
    else if(e.key==='End'){ e.preventDefault(); opts[opts.length-1].focus(); }
    else if(e.key==='Escape'){ e.preventDefault(); closeMenu(true); }
    else if(e.key==='Tab'){ closeMenu(); }
  });
}
document.addEventListener('pointerdown',e=>{ if(openDD && !openDD.menu.contains(e.target) && !openDD.anchor.contains(e.target)) closeMenu(); });
window.addEventListener('resize',()=>closeMenu());
document.addEventListener('scroll',e=>{ if(openDD && !openDD.menu.contains(e.target)) closeMenu(); },true);

function fresh(preset='tutor', lang='ar'){
  const p = PRESETS[preset];
  return { v:2, lang, preset, theme:'linen', mode:'auto', font:'naskh', layout:'list', decor:true, freeformOn:true, qr:true,
    numerals: lang==='ar'?'arabic':'latin', clock:'24h', paper:'A4', orient:'portrait', ink:'color', clean:false,
    eyebrow:'', name:'', sub:'', photo:null, badge:'', title:p.t[lang], note:'', freeform:'', footer:'',
    groups:[{id:uid(),label:p.g[lang]+' 1',slots:[{id:uid(),from:'09:00',to:'11:00',note:'',full:false},{id:uid(),from:'17:00',to:'19:00',note:'',full:false}]}],
    contacts:[{id:uid(),type:'whatsapp',value:''}] };
}
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v===2 && Array.isArray(s.groups)) return Object.assign(fresh(s.preset,s.lang), s); }catch(e){}
  return fresh();
}
let S = load();
let saveT; function save(){ clearTimeout(saveT); saveT = setTimeout(()=>{ try{localStorage.setItem(KEY, JSON.stringify(S));}catch(e){} },300); }

const AD='٠١٢٣٤٥٦٧٨٩';
const digits = s => S.numerals==='arabic' ? String(s).replace(/\d/g,d=>AD[d]) : String(s).replace(/[٠-٩]/g,d=>AD.indexOf(d));
function parseTime(raw){
  raw = String(raw||'').trim().replace(/[٠-٩]/g,d=>AD.indexOf(d)).replace(/\s*(ص|م|am|pm)$/i,'');
  const m = /^(\d{1,2})(?:[:.](\d{2}))?$/.exec(raw); if(!m) return null;
  const h=+m[1], mi=+(m[2]||0); if(h>23||mi>59) return null;
  return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0');
}
function fmt(hhmm){
  const m = /^(\d{2}):(\d{2})$/.exec(hhmm||''); if(!m) return digits(hhmm||'');
  let h=+m[1], suf='';
  if (S.clock==='12h'){ suf=' '+(h>=12?L().pm:L().am); h=h%12||12; }
  return digits(h+':'+m[2]+suf);
}

function href(c){
  const v=(c.value||'').trim(); if(!v) return '';
  if(c.type==='whatsapp'){ const d=v.replace(/\D/g,''); return d?'https://wa.me/'+d:''; }
  if(c.type==='phone') return 'tel:'+v.replace(/[^\d+]/g,'');
  if(c.type==='mail') return 'mailto:'+v;
  if(c.type==='insta') return /^https?:/.test(v)?v:'https://instagram.com/'+v.replace(/^@/,'');
  return /^https?:/.test(v)?v:(c.type==='link'?'https://'+v:'');
}
function qrSvg(text){
  if(!text || typeof qrcode!=='function') return '';
  try{ const q=qrcode(0,'M'); q.addData(text); q.make(); return q.createSvgTag({cellSize:4,margin:0,scalable:true}); }catch(e){ return ''; }
}

const ce = (bind, val, ph, cls, tag='span', extra='') => `<${tag} class="${cls}" contenteditable="true" data-b="${bind}" data-ph="${esc(ph)}" ${extra}>${esc(val)}</${tag}>`;
function render(){
  const t=L();
  const photo = S.photo ? `<img src="${esc(S.photo)}" alt="">` : `<svg class="i" style="width:40%;height:40%"><use href="#i-img"/></svg>`;
  const photoBlock = (S.photo || !S.clean) ? `<label class="photo ${S.photo?'':'empty-print'}" title="Photo">${photo}<input type="file" accept="image/*" data-a="photo"></label>` : '';
  const groups = S.groups.map(g=>`
    <section class="group" data-g="${g.id}">
      <div class="g-head">${ce('g.label',g.label,t.group,'g-label')}<button class="ed" data-a="delG" title="×"><svg class="i"><use href="#i-x"/></svg></button></div>
      <div class="slots">${g.slots.map(s=>`
        <div class="slot" data-s="${s.id}">
          ${ce('s.from',fmt(s.from),'09:00','time','span','dir="ltr" inputmode="numeric"')}<span class="dash">–</span>${ce('s.to',fmt(s.to),'11:00','time','span','dir="ltr" inputmode="numeric"')}
          ${ce('s.note',s.note,S.clean?'':t.sNote,'s-note')}
          ${s.full||!S.clean?`<button class="full ${s.full?'':'off ed-full'}" data-a="full">${esc(t.full)}</button>`:''}
          <button class="ed" data-a="delS"><svg class="i"><use href="#i-x"/></svg></button>
        </div>`).join('')}
        <button class="add" data-a="addS"><svg class="i"><use href="#i-plus"/></svg>${esc(t.addSlot)}</button>
      </div>
    </section>`).join('');
  const contacts = S.contacts.map(c=>`
    <span class="chip ${c.value.trim()?'':'empty'}" data-c="${c.id}"><button class="ctype" type="button" data-a="ctype" aria-haspopup="listbox" aria-expanded="false" title="${esc(CONTACTS[c.type][1][S.lang])}"><svg class="i"><use href="#${CONTACTS[c.type][0]}"/></svg></button>
      ${ce('c.value',c.value,'…','val')}<button class="ed" data-a="delC"><svg class="i"><use href="#i-x"/></svg></button></span>`).join('');
  const link = (S.contacts.map(href).find(Boolean)) || '';
  $('content').innerHTML = `
    <header class="hd">${photoBlock}<div class="hd-text">${ce('eyebrow',S.eyebrow,t.eyebrow,'eyebrow')}${ce('name',S.name,t.name,'name')}${ce('sub',S.sub,t.sub,'sub')}</div></header>
    <div class="title-block">${(S.badge||!S.clean)?ce('badge',S.badge,t.badge,'badge'):''}${ce('title',S.title,t.title,'title')}${(S.note||!S.clean)?ce('note',S.note,t.note,'note'):''}</div>
    <div class="groups">${groups}</div>
    <button class="add" data-a="addG"><svg class="i"><use href="#i-plus"/></svg>${esc(t.addGroup)}</button>
    ${S.freeformOn?ce('freeform',S.freeform,t.freePh,'freeform','div'):''}
    <footer class="bottom"><div class="contacts">${contacts}<button class="add" data-a="addC"><svg class="i"><use href="#i-plus"/></svg>${esc(t.addContact)}</button>
      ${ce('footer',S.footer,S.clean?'':t.footer,'footer-text')}</div>
      ${S.qr&&link?`<div class="qr">${qrSvg(link)}</div>`:''}</footer>`;
  fit();
}

function applyPage(){
  let [w,h]=PAPER[S.paper]; if(S.orient==='landscape') [w,h]=[h,w];
  const root=document.documentElement.style;
  root.setProperty('--paper-w',w+'mm'); root.setProperty('--paper-h',h+'mm');
  root.setProperty('--pad', (S.paper==='A5'?11:16)+'mm');
  $('pageRule').textContent=`@page{size:${w}mm ${h}mm;margin:0}`;
  scaleToScreen();
}
function fit(){
  const c=$('content'), p=$('paper');
  let f=1; c.style.setProperty('--fit',1);
  const avail = () => p.clientHeight - parseFloat(getComputedStyle(p).paddingTop)*2;
  while (c.scrollHeight > avail()+1 && f>0.5){ f-=0.03; c.style.setProperty('--fit',f.toFixed(2)); }
  $('fitNote').textContent = f<0.999 ? L().fitted(Math.round(f*100)) : '';
}
function scaleToScreen(){
  const wrap=$('wrap');
  let [w,h]=PAPER[S.paper]; if(S.orient==='landscape') w=h;
  const availW = $('stage').clientWidth - 24;
  const s = Math.min(1, availW / (w*96/25.4));
  const px = 96/25.4, H = (S.orient==='landscape'?PAPER[S.paper][0]:PAPER[S.paper][1])*px;
  wrap.style.width = (w*px*s)+'px'; wrap.style.height = (H*s)+'px';
  $('paper').style.transform = s<1 ? `scale(${s})` : '';
}

function chrome(){
  const h=document.documentElement, t=L();
  h.lang=S.lang; h.dir=S.lang==='ar'?'rtl':'ltr'; $('paper').dir=h.dir;
  const dark = S.mode==='dark' || (S.mode==='auto' && darkMQ.matches);
  Object.assign(h.dataset,{mode:dark?'dark':'light',theme:S.theme,type:S.font,layout:S.layout,decor:S.decor?'on':'off',ink:S.ink});
  h.classList.toggle('clean',S.clean);
  document.querySelectorAll('[data-t]').forEach(el=>{ const v=t[el.dataset.t]; if(typeof v==='string') el.textContent=v; });
  document.title = t.brand+' · '+(S.lang==='ar'?'Lawha':'لوحة');
  document.querySelector('meta[name=theme-color]').content=getComputedStyle(h).getPropertyValue('--bg').trim();
  $('presetLabel').textContent=PRESETS[S.preset][S.lang];
  $('swatches').innerHTML=Object.keys(THEMES).map(k=>`<button class="sw" data-v="${k}" title="${k}" style="--a:${THEMES[k][0]};--b:${THEMES[k][1]}" aria-pressed="${k===S.theme}"></button>`).join('');
  for(const id in SEGS) $(id).querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S[SEGS[id]]));
  $('decor').checked=S.decor; $('freeformTog').checked=S.freeformOn; $('qrTog').checked=S.qr; $('inkTog').checked=S.ink==='saver'; $('cleanTog').checked=S.clean;
}
function full(){ chrome(); applyPage(); render(); save(); }

function setBind(el){
  const b=el.dataset.b, txt=el.innerText.replace(/\n$/,'');
  const g=S.groups.find(x=>x.id===el.closest('[data-g]')?.dataset.g);
  const s=g?.slots.find(x=>x.id===el.closest('[data-s]')?.dataset.s);
  const c=S.contacts.find(x=>x.id===el.closest('[data-c]')?.dataset.c);
  if(b==='g.label') g.label=txt; else if(b==='s.note') s.note=txt; else if(b==='c.value') c.value=txt;
  else if(b==='s.from'||b==='s.to'){} else S[b]=txt;
  save();
}
const content=$('content');
content.addEventListener('input',e=>{ if(e.target.dataset.b) setBind(e.target); });
content.addEventListener('focusin',e=>{ const el=e.target; if(el.classList.contains('time')){ const s=findSlot(el); el.textContent=s[el.dataset.b==='s.from'?'from':'to']; } });
content.addEventListener('focusout',e=>{
  const el=e.target; if(!el.dataset?.b) return;
  if(el.classList.contains('time')){ const s=findSlot(el), k=el.dataset.b==='s.from'?'from':'to'; const v=parseTime(el.textContent); if(v) s[k]=v; else if(!el.textContent.trim()) s[k]=''; el.textContent=fmt(s[k]); save(); }
  fit(); if(el.dataset.b==='c.value') render();
});
content.addEventListener('keydown',e=>{ if(e.key==='Enter' && !e.target.classList.contains('freeform') && !e.target.classList.contains('note') && e.target.dataset.b){ e.preventDefault(); e.target.blur(); } });
content.addEventListener('paste',e=>{ if(!e.target.closest('[contenteditable]')) return; e.preventDefault(); document.execCommand('insertText',false,e.clipboardData.getData('text/plain')); });
function findSlot(el){ const g=S.groups.find(x=>x.id===el.closest('[data-g]').dataset.g); return g.slots.find(x=>x.id===el.closest('[data-s]').dataset.s); }
content.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b||b.tagName==='SELECT'||b.tagName==='INPUT') return;
  const a=b.dataset.a, gid=b.closest('[data-g]')?.dataset.g, g=S.groups.find(x=>x.id===gid);
  if(a==='addG') S.groups.push({id:uid(),label:PRESETS[S.preset].g[S.lang]+' '+(S.groups.length+1),slots:[{id:uid(),from:'09:00',to:'11:00',note:'',full:false}]});
  else if(a==='delG') S.groups=S.groups.filter(x=>x.id!==gid);
  else if(a==='addS'){ const last=g.slots[g.slots.length-1]; g.slots.push({id:uid(),from:last?last.to:'09:00',to:'',note:'',full:false}); }
  else if(a==='delS') g.slots=g.slots.filter(x=>x.id!==b.closest('[data-s]').dataset.s);
  else if(a==='full'){ const s=g.slots.find(x=>x.id===b.closest('[data-s]').dataset.s); s.full=!s.full; }
  else if(a==='ctype'){
    const c=S.contacts.find(x=>x.id===b.closest('[data-c]').dataset.c);
    openMenu(b, Object.keys(CONTACTS).map(k=>({v:k,label:CONTACTS[k][1][S.lang],icon:CONTACTS[k][0]})), c.type, v=>{ c.type=v; render(); save(); const nb=document.querySelector(`[data-c="${c.id}"] .ctype`); nb&&nb.focus(); });
    return;
  }
  else if(a==='addC') S.contacts.push({id:uid(),type:'phone',value:''});
  else if(a==='delC') S.contacts=S.contacts.filter(x=>x.id!==b.closest('[data-c]').dataset.c);
  else return;
  render(); save();
});
content.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.a==='photo' && el.files[0]){
    const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'), m=400, k=Math.min(1,m/Math.max(img.width,img.height));
      c.width=img.width*k; c.height=img.height*k; c.getContext('2d').drawImage(img,0,0,c.width,c.height); S.photo=c.toDataURL('image/jpeg',.85); render(); save(); }; img.src=r.result; }; r.readAsDataURL(el.files[0]);
  }
});
content.addEventListener('contextmenu',e=>{ if(e.target.closest('.photo') && S.photo){ e.preventDefault(); S.photo=null; render(); save(); } });

$('preset').onclick=()=>openMenu($('preset'), Object.keys(PRESETS).map(k=>({v:k,label:PRESETS[k][S.lang]})), S.preset, pickPreset);
function pickPreset(v){ const old=PRESETS[S.preset]; S.preset=v; const p=PRESETS[S.preset];
  if(!S.title || S.title===old.t.ar || S.title===old.t.en) S.title=p.t[S.lang];
  S.groups.forEach((g,i)=>{ if(g.label.startsWith(old.g.ar)||g.label.startsWith(old.g.en)) g.label=p.g[S.lang]+' '+(i+1); }); full(); }
$('swatches').onclick=e=>{ const b=e.target.closest('.sw'); if(b){ S.theme=b.dataset.v; full(); } };
for(const id in SEGS) $(id).onclick=e=>{ const b=e.target.closest('button'); if(!b) return;
  if(SEGS[id]==='lang' && b.dataset.v!==S.lang){ S.numerals=b.dataset.v==='ar'?'arabic':'latin'; }
  S[SEGS[id]]=b.dataset.v; full(); };
darkMQ.addEventListener?.('change',()=>{ if(S.mode==='auto') chrome(); });
$('decor').onchange=e=>{S.decor=e.target.checked;full();};
$('freeformTog').onchange=e=>{S.freeformOn=e.target.checked;full();};
$('qrTog').onchange=e=>{S.qr=e.target.checked;full();};
$('inkTog').onchange=e=>{S.ink=e.target.checked?'saver':'color';full();};
$('cleanTog').onchange=e=>{S.clean=e.target.checked;full();};

$('printBtn').onclick=()=>{ document.activeElement?.blur(); fit(); window.print(); };
window.addEventListener('beforeprint',()=>{ $('paper').style.transform=''; fit(); });
window.addEventListener('afterprint',scaleToScreen);
window.addEventListener('resize',scaleToScreen);

function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),2000); }
$('exportBtn').onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'})); a.download='lawha.json'; a.click(); toast(L().saved); };
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=e=>{ const f=e.target.files[0]; if(!f) return; f.text().then(txt=>{ try{ const s=JSON.parse(txt); if(!Array.isArray(s.groups)) throw 0; S=Object.assign(fresh(s.preset in PRESETS?s.preset:'tutor',s.lang==='en'?'en':'ar'),s,{v:2}); full(); toast(L().imported);}catch(_){ toast(L().bad);} }); e.target.value=''; };
$('resetBtn').onclick=()=>{ if(confirm(L().confirm)){ const th=S.theme; S=fresh(S.preset,S.lang); S.theme=th; full(); } };

document.fonts?.ready.then(()=>fit());
full();
</script>
</body>
</html>
