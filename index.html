<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="classic" data-print-mode="poster" data-ink="color">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ورقة</title>
<meta name="theme-color" content="#C2603C">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20x%3D%273%27%20y%3D%275%27%20width%3D%2726%27%20height%3D%2724%27%20rx%3D%276%27%20fill%3D%27none%27%20stroke%3D%27%232B2620%27%20stroke-width%3D%272.2%27%2F%3E%3Cpath%20d%3D%27M3%2012h26M10%203v4M22%203v4%27%20stroke%3D%27%232B2620%27%20stroke-width%3D%272.2%27%20stroke-linecap%3D%27round%27%2F%3E%3Ccircle%20cx%3D%2716%27%20cy%3D%2721%27%20r%3D%275%27%20fill%3D%27none%27%20stroke%3D%27%232B2620%27%20stroke-width%3D%272.2%27%2F%3E%3Cpath%20d%3D%27M16%2018.4V21l1.9%201.3%27%20stroke%3D%27%232B2620%27%20stroke-width%3D%272%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%2F%3E%3C%2Fsvg%3E">
<link rel="apple-touch-icon" id="appleTouchIcon">
<link rel="manifest" id="manifestLink">
<style>
:root{
  --radius-card:28px; --radius-row:18px; --radius-pill:999px; --radius-sm:10px;
  --shadow-soft:0 10px 30px -18px rgba(20,16,10,0.35);
  --shadow-hover:0 16px 34px -16px rgba(20,16,10,0.4);
  --gap-xs:.5rem; --gap-sm:.9rem; --gap-md:1.4rem; --gap-lg:2.2rem;
  --font-latin-body:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-latin-deco:"Playfair Display","Georgia",serif;
  --font-arabic-body:"Noto Naskh Arabic","Segoe UI",Tahoma,"Geeza Pro",serif;
  --font-arabic-deco:"Aref Ruqaa","Amiri","Noto Naskh Arabic",serif;
  --type-scale:1;
  --base-fs:16px;
}
html[lang="ar"]{ --font-body:var(--font-arabic-body); --font-deco:var(--font-arabic-deco); }
html[lang="en"]{ --font-body:var(--font-latin-body); --font-deco:var(--font-latin-deco); }

html[data-theme="classic"]{
  --bg-base:#F3EEE7; --bg-surface:#FFFFFF; --text-main:#2B2620; --text-soft:#6E6355;
  --accent:#C2603C; --accent-soft:rgba(194,96,60,.12); --accent-contrast:#ffffff;
  --card-border:rgba(43,38,32,.12); --line:rgba(43,38,32,.14);
  --radius-shape: var(--radius-card);
}
html[data-theme="luxury"]{
  --bg-base:#0a0906; --bg-surface:#15130d; --text-main:#F3EEDF; --text-soft:#B3A78C;
  --accent:#C9A227; --accent-soft:rgba(201,162,39,.12); --accent-contrast:#100e0a;
  --card-border:rgba(201,162,39,.25); --line:rgba(201,162,39,.2);
  --radius-shape: 8px;
}
html[data-theme="modern"]{
  --bg-base:#EDF3F1; --bg-surface:#FFFFFF; --text-main:#122420; --text-soft:#5C736D;
  --accent:#0B6B5C; --accent-soft:rgba(11,107,92,.09); --accent-contrast:#ffffff;
  --card-border:rgba(18,36,32,.12); --line:rgba(18,36,32,.12);
  --radius-shape: 20px;
}
html[data-theme="gazette"]{
  --bg-base:#EDE9DD; --bg-surface:#FAF8F2; --text-main:#231F1B; --text-soft:#5A5347;
  --accent:#8B1E1E; --accent-soft:rgba(139,30,30,.08); --accent-contrast:#FBF9F2;
  --card-border:rgba(35,31,27,.18); --line:rgba(35,31,27,.22);
  --radius-shape: 2px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg-base); color:var(--text-main);
  font-family:var(--font-body); font-size:var(--base-fs);
  min-height:100vh; transition:background .3s ease,color .3s ease;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,p,ul{margin:0;}
button{font-family:inherit;}
[hidden]{display:none !important;}
bdi{unicode-bidi:isolate;}
.icon{width:20px;height:20px;flex:none;}
.icon-sm{width:16px;height:16px;}
.icon-lg{width:28px;height:28px;}

/* ---------- app shell ---------- */
#app{display:flex;flex-direction:column;min-height:100vh;}
#toolbar{
  display:flex;align-items:center;gap:var(--gap-sm);flex-wrap:wrap;
  padding:.9rem 1.4rem;background:var(--bg-surface);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:40;box-shadow:var(--shadow-soft);
}
.tb-group{display:flex;align-items:center;gap:.5rem;}
.tb-brand{gap:.6rem;}
.tb-brand-label{font-family:var(--font-deco);font-size:1.3rem;color:var(--text-main);}
.tb-push{margin-inline-start:auto;}
.tb-field{display:flex;flex-direction:column;gap:.2rem;font-size:.72rem;color:var(--text-soft);}
.tb-field-label{padding-inline-start:.2rem;}
.tb-field select,select{
  font-family:inherit;font-size:.85rem;padding:.45rem .8rem;border-radius:var(--radius-sm);
  border:1px solid var(--card-border);background:var(--bg-base);color:var(--text-main);
}
.select-wrap{position:relative;display:inline-flex;align-items:center;width:100%;}
.select-wrap select{
  appearance:none;-webkit-appearance:none;-moz-appearance:none;width:100%;
  padding-inline-end:2rem;border-color:var(--card-border);cursor:pointer;
  transition:border-color .15s ease,box-shadow .15s ease;
}
.select-wrap select:hover{border-color:var(--accent);}
.select-wrap select:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.select-wrap::after{
  content:'';position:absolute;inset-inline-end:.9rem;top:50%;
  width:7px;height:7px;border-inline-end:1.6px solid var(--text-soft);border-block-end:1.6px solid var(--text-soft);
  transform:translateY(-65%) rotate(45deg);pointer-events:none;
}
.select-wrap-icon select{padding-inline-start:2rem;}
.select-lead-icon{position:absolute;inset-inline-start:.65rem;top:50%;transform:translateY(-50%);color:var(--accent);pointer-events:none;width:16px;height:16px;}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;
  border-radius:var(--radius-pill);border:1px solid transparent;background:transparent;
  color:var(--text-main);cursor:pointer;transition:all .15s ease;
}
.icon-btn:hover{background:var(--accent-soft);color:var(--accent);}
.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.icon-btn:disabled{opacity:.35;cursor:default;}
.icon-btn:disabled:hover{background:transparent;color:var(--text-main);}
.icon-btn.is-active{background:var(--accent);color:var(--accent-contrast);}
#numeralGlyph{font-weight:700;font-size:.9rem;}
.btn-pill{
  display:inline-flex;align-items:center;gap:.5rem;padding:.6rem 1.3rem;border-radius:var(--radius-pill);
  border:1px solid var(--card-border);background:var(--bg-base);color:var(--text-main);
  font-size:.92rem;font-weight:600;cursor:pointer;transition:all .15s ease;
}
.btn-pill:hover{transform:translateY(-1px);box-shadow:var(--shadow-hover);}
.btn-accent{background:var(--accent);color:var(--accent-contrast);border-color:transparent;}
.theme-swatch{
  width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;
  background:var(--sw-bg);position:relative;transition:transform .15s ease;
}
.theme-swatch::after{
  content:'';position:absolute;inset:4px;border-radius:50%;background:var(--sw-accent);
}
.theme-swatch:hover{transform:scale(1.08);}
.theme-swatch[aria-pressed="true"]{border-color:var(--text-main);}

#canvas{flex:1;display:flex;justify-content:center;padding:2.6rem 1.4rem 4rem;}

/* ---------- sheet root (the editable announcement) ---------- */
.sheet-root{width:100%;max-width:760px;}
.sheet-card{
  background:var(--bg-surface);border:1px solid var(--card-border);border-radius:var(--radius-shape);
  box-shadow:var(--shadow-soft);padding:clamp(1.8rem,4vw,3.4rem);position:relative;overflow:hidden;
}
html[data-theme="modern"] .sheet-card{border-top:6px solid var(--accent);}
html[data-theme="gazette"] .sheet-card{border:1px solid var(--text-main);box-shadow:none;}
html[data-theme="luxury"] .sheet-card{background:linear-gradient(155deg,var(--bg-surface),#0a0906);}

[contenteditable="true"]{outline:none;border-radius:6px;padding:.1em .3em;margin:-.1em -.3em;cursor:text;}
[contenteditable="true"]:hover{background:var(--accent-soft);}
[contenteditable="true"]:focus{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent);}
[contenteditable="true"]:empty::before{content:attr(data-placeholder);color:var(--text-soft);opacity:.6;}

.sheet-eyebrow{
  font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
  font-weight:700;margin-bottom:.8rem;display:block;
}
:lang(ar) .sheet-eyebrow{letter-spacing:normal;text-transform:none;}
.sheet-profile{display:flex;align-items:center;gap:1.3rem;margin-bottom:1.6rem;}
.profile-photo{
  width:84px;height:84px;border-radius:var(--radius-shape);flex:none;position:relative;overflow:hidden;
  background:var(--accent-soft);border:1px solid var(--card-border);cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--accent);
}
.profile-photo img{width:100%;height:100%;object-fit:cover;}
.profile-photo input{display:none;}
.profile-photo-wrap{position:relative;flex:none;}
.photo-remove-btn{
  position:absolute;top:-6px;inset-inline-end:-6px;width:22px;height:22px;border-radius:50%;
  background:var(--text-main);color:var(--bg-base);border:2px solid var(--bg-surface);
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
}
.photo-remove-btn:hover{background:var(--accent);}
.profile-text{flex:1;min-width:0;}
.profile-name{
  font-family:var(--font-deco);font-size:clamp(1.5rem,3vw,2.1rem);font-weight:700;
  color:var(--text-main);display:block;line-height:1.2;
}
.profile-subtitle{color:var(--text-soft);font-size:1rem;margin-top:.3rem;display:block;}

.sheet-headline{text-align:center;padding:1.6rem 0 2rem;position:relative;}
.headline-badge{
  display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;
  font-size:.82rem;letter-spacing:.08em;padding:.35rem 1rem;border-radius:var(--radius-pill);margin-bottom:.9rem;
}
:lang(ar) .headline-badge{letter-spacing:normal;}
.headline-title{
  font-family:var(--font-deco);font-size:clamp(1.6rem,3.4vw,2.3rem);font-weight:700;
  display:block;color:var(--text-main);
}
.headline-note{color:var(--text-soft);margin-top:.6rem;display:block;font-size:.98rem;}

.sheet-groups{display:flex;flex-direction:column;gap:1.1rem;margin-bottom:1.6rem;}
.group-block{
  background:var(--bg-base);border:1px solid var(--card-border);border-radius:var(--radius-row);
  padding:1.1rem 1.3rem;
}
html[data-theme="modern"] .group-block{background:#fff;border-inline-start:4px solid var(--accent);}
.group-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.7rem;gap:.6rem;}
.group-label{font-weight:700;color:var(--accent);font-size:1rem;flex:1;}
.row-remove-btn{
  width:26px;height:26px;border-radius:50%;border:none;background:transparent;color:var(--text-soft);
  cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.5;transition:opacity .15s ease;flex:none;
}
.row-remove-btn:hover{opacity:1;color:var(--accent);}
.slot-list{display:flex;flex-wrap:wrap;gap:.6rem;}
.slot-pill{
  display:flex;align-items:center;gap:.5rem;background:var(--bg-surface);border:1px solid var(--card-border);
  border-radius:var(--radius-pill);padding:.5rem .5rem .5rem 1rem;font-size:.92rem;
}
[dir="rtl"] .slot-pill{padding:.5rem 1rem .5rem .5rem;}
.slot-time{font-weight:700;color:var(--text-main);white-space:nowrap;display:flex;align-items:center;gap:.3rem;}
.slot-time svg{color:var(--accent);opacity:.7;}
.slot-note{color:var(--text-soft);}
.slot-full{color:var(--accent);font-weight:700;font-size:.78rem;}
.slot-full-btn{
  border:1px dashed var(--card-border);border-radius:var(--radius-pill);padding:.2rem .7rem;font-size:.74rem;
  background:transparent;color:var(--text-soft);cursor:pointer;
}
.slot-full-btn.is-full{border-style:solid;border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
.add-btn{
  align-self:flex-start;border:1px dashed var(--card-border);color:var(--accent);background:transparent;
  padding:.45rem 1.1rem;border-radius:var(--radius-pill);font-size:.85rem;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:.4rem;transition:all .15s ease;
}
.add-btn:hover{background:var(--accent-soft);}
.add-group-row{display:flex;justify-content:center;}

.sheet-contacts{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center;margin-bottom:1.4rem;}
.contact-chip{
  display:flex;align-items:center;gap:.55rem;background:var(--accent-soft);color:var(--accent);
  border-radius:var(--radius-pill);padding:.55rem 1.1rem;font-weight:600;font-size:.9rem;text-decoration:none;
  border:1px solid transparent;
}
.contact-chip svg{color:var(--accent);}
.contact-chip .row-remove-btn{color:var(--accent);opacity:.5;}

.sheet-footer{text-align:center;border-top:1px dashed var(--card-border);padding-top:1.4rem;display:flex;
  flex-direction:column;align-items:center;gap:.9rem;}
.footer-text{color:var(--text-soft);font-size:.88rem;max-width:32em;display:block;}
.footer-qr{background:#fff;padding:8px;border-radius:10px;line-height:0;}
.footer-qr svg{display:block;}

.toolbar-mini{display:flex;gap:.4rem;justify-content:center;margin-top:.6rem;}

.time-input{
  font-family:inherit;font-weight:700;font-size:.92rem;color:var(--text-main);border:none;
  background:transparent;padding:0;width:3.2em;text-align:center;
}
.time-input:focus{background:var(--accent-soft);border-radius:6px;}
.time-input::placeholder{color:var(--text-soft);opacity:.5;font-weight:400;}
.contact-type-select{
  border:none;background:transparent;color:inherit;font-size:.78rem;font-weight:600;
  padding:0;-webkit-appearance:none;appearance:none;cursor:pointer;
}
button:focus-visible,select:focus-visible,[contenteditable]:focus-visible,
.theme-swatch:focus-visible,input:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;
}

/* ---------- print preview overlay ---------- */
.preview-overlay{
  position:fixed;inset:0;background:rgba(10,9,6,.55);z-index:100;display:flex;
  align-items:stretch;justify-content:center;padding:2rem;backdrop-filter:blur(2px);
}
.preview-panel{
  background:var(--bg-surface);border-radius:20px;max-width:1180px;width:100%;display:flex;
  overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);
}
.preview-controls{
  width:270px;flex:none;padding:1.6rem;display:flex;flex-direction:column;gap:1rem;
  border-inline-end:1px solid var(--line);overflow-y:auto;
}
.preview-controls-head{display:flex;align-items:center;justify-content:space-between;}
.preview-controls-head h2{font-family:var(--font-deco);font-size:1.2rem;}
.pc-field{display:flex;flex-direction:column;gap:.3rem;font-size:.82rem;color:var(--text-soft);}
.pc-field select{width:100%;}
.pc-toggle{display:flex;align-items:center;gap:.6rem;font-size:.86rem;cursor:pointer;}
.pc-meta{font-size:.78rem;color:var(--text-soft);border-top:1px solid var(--line);padding-top:.8rem;}
.preview-stage{
  flex:1;background:#3a3630;padding:2.4rem;overflow:auto;display:flex;
  flex-direction:column;align-items:center;position:relative;
}
.pv-grid{display:grid;grid-template-columns:7mm auto;grid-template-rows:7mm auto;gap:0;}
.preview-ruler-top{grid-column:2;grid-row:1;position:relative;height:7mm;}
.preview-ruler-side{grid-column:1;grid-row:2;position:relative;width:7mm;}
.ruler-tick{position:absolute;background:#c9c4b8;}
.ruler-tick.major{background:#8a8574;}
.ruler-label{position:absolute;font-size:6.5px;color:#8a8574;font-family:var(--font-latin-body);}
.preview-pages{grid-column:2;grid-row:2;display:flex;flex-direction:column;gap:10mm;}
.image-preview-canvas{max-width:min(100%,420px);max-height:70vh;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.4);align-self:center;margin:auto;}

/* ---------- toasts ---------- */
.toast-host{position:fixed;bottom:1.6rem;inset-inline:0;display:flex;flex-direction:column;
  align-items:center;gap:.5rem;pointer-events:none;z-index:200;}
.toast{
  background:var(--text-main);color:var(--bg-base);padding:.7rem 1.3rem;border-radius:var(--radius-pill);
  font-size:.88rem;box-shadow:var(--shadow-hover);opacity:0;transform:translateY(8px);
  transition:all .25s ease;
}
.toast.show{opacity:1;transform:translateY(0);}

.print-mount{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:-1;}

@media (max-width:760px){
  #toolbar{padding:.7rem .9rem;}
  .tb-brand-label{display:none;}
  .preview-overlay{padding:0;}
  .preview-panel{flex-direction:column;border-radius:0;height:100%;}
  .preview-controls{width:100%;border-inline-end:none;border-bottom:1px solid var(--line);
    flex-direction:row;flex-wrap:wrap;max-height:40vh;}
  .preview-controls-head{width:100%;}
}

/* ---------- print page (also used for on-screen true-size preview) ---------- */
.pv-page{
  background:#fff;color:var(--text-main);box-shadow:0 10px 30px rgba(0,0,0,.4);position:relative;flex:none;
  overflow:hidden;font-family:var(--font-body);
}
.pv-page *{box-sizing:border-box;}
.pv-page .pp-inner{
  width:100%;height:100%;padding:var(--pg-margin);display:flex;flex-direction:column;
}
.pv-page[data-ink="saver"]{background:#fff !important;}
.pv-page:has(.pp-poster-body){background:var(--bg-base);}
.pv-page[data-theme="luxury"]{
  --bg-base:#FBF6E9; --bg-surface:#FFFFFF; --text-main:#2B2410; --text-soft:#6B5F3A;
  --accent:#9C7A1E; --accent-soft:rgba(156,122,30,.12); --accent-contrast:#FBF6E9;
  --card-border:rgba(43,36,16,.16); --line:rgba(43,36,16,.18);
}
.pv-page[data-theme="luxury"] .sheet-card{background:var(--bg-surface) !important;}
.pv-page[data-ink="saver"] .sheet-card,
.pv-page[data-ink="saver"] .group-block,
.pv-page[data-ink="saver"] .headline-badge,
.pv-page[data-ink="saver"] .contact-chip,
.pv-page[data-ink="saver"] .pp-card-cell,
.pv-page[data-ink="saver"] .mini-qr,
.pv-page[data-ink="saver"] .slot-full-btn.is-full{
  background:transparent !important; box-shadow:none !important;
}
.pv-page[data-ink="saver"] *{ color:#111 !important; }
.pv-page[data-ink="saver"] .sheet-card{ border:.3mm solid #111 !important; }
.pv-page[data-ink="color"]{ print-color-adjust:exact; -webkit-print-color-adjust:exact; }

.pp-header-strip{
  display:flex;align-items:baseline;justify-content:space-between;font-size:9pt;
  color:var(--text-soft);border-bottom:.3mm solid var(--card-border);padding-bottom:4pt;margin-bottom:8pt;flex:none;
}
.pp-header-strip b{color:var(--text-main);font-family:var(--font-deco);font-size:11pt;}

.pp-poster-body{flex:1;display:flex;flex-direction:column;justify-content:center;
  font-size:calc(16pt * var(--type-scale));}
.pp-poster-body .sheet-card{box-shadow:none;}
.pp-poster-body .sheet-eyebrow{font-size:.85em;}
.pp-poster-body .profile-name{font-size:2.9em;}
.pp-poster-body .profile-subtitle{font-size:1em;}
.pp-poster-body .headline-badge{font-size:.8em;}
.pp-poster-body .headline-title{font-size:2.3em;}
.pp-poster-body .headline-note{font-size:1em;}
.pp-poster-body .group-label{font-size:1.05em;}
.pp-poster-body .slot-pill{font-size:1em;}
.pp-poster-body .contact-chip{font-size:1em;}
.pp-poster-body .footer-text{font-size:.85em;}

.pp-sheet-body .group-block{page-break-inside:avoid;box-shadow:none;}

.pp-cards-grid{flex:1;display:grid;gap:0;font-size:calc(7pt * var(--type-scale));}
.pp-card-cell{
  border:.3mm dashed #999;padding:6mm;display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;gap:.4em;overflow:hidden;background:var(--bg-base);
}
.pp-card-cell .mini-name{font-family:var(--font-deco);font-size:1.9em;font-weight:700;color:var(--text-main);}
.pp-card-cell .mini-sub{font-size:1.2em;color:var(--text-soft);}
.pp-card-cell .mini-line{font-size:1.3em;}
.pp-card-cell .mini-line b{color:var(--accent);}
.pp-card-cell .mini-qr{margin-top:.4em;background:#fff;padding:2mm;border-radius:2mm;display:inline-block;width:fit-content;}
.pp-card-cell .mini-qr svg{width:18mm;height:18mm;display:block;}

.pp-footer-strip{
  flex:none;font-size:8pt;color:#777;text-align:center;border-top:.3mm solid #ccc;

  .print-mount .pv-page{box-shadow:none !important;break-after:page;}

}

function uid(){ return Math.random().toString(36).slice(2,9); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function debounce(fn, ms){
  let t = null;
  return function(...args){ clearTimeout(t); t = setTimeout(() => fn.apply(this, args), ms); };
}
function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }
function mmToPx(mm){ return mm * 96 / 25.4; }
function pxToMm(px){ return px * 25.4 / 96; }

const THEMES = ['classic', 'modern', 'gazette', 'luxury'];

const STORAGE_KEY = 'sheet-app:v1';
const MAX_HISTORY = 80;

function defaultState(presetKey, lang){
  presetKey = PRESETS[presetKey] ? presetKey : 'tutor';
  lang = lang === 'en' ? 'en' : 'ar';
  const p = PRESETS[presetKey];
  const g1 = uid(), s1 = uid(), s2 = uid();
  return {
    v: 1,
    lang, dir: lang === 'ar' ? 'rtl' : 'ltr',
    numerals: lang === 'ar' ? 'arabic' : 'latin',
    timeFormat: '24h',
    preset: presetKey,
    theme: 'classic',
    profile: { name: '', subtitle: '', eyebrow: p.defaults.eyebrow[lang], photo: null },
    headline: { title: p.defaults.title[lang], badge: '', note: '' },
    groups: [
      { id: g1, label: p.defaults.groupLabel[lang] + ' 1', slots: [
        { id: s1, from: '09:00', to: '11:00', note: '', full: false },
        { id: s2, from: '17:00', to: '19:00', note: '', full: false }
      ] }
    ],
    contacts: [
      { id: uid(), type: 'whatsapp', value: '', label: '' }
    ],
    footer: { text: '', showQr: true },
    print: { mode: 'poster', paper: 'A4', orientation: 'portrait', margin: 'normal', ink: 'color', nUp: 4, cropMarks: false, imageSize: 'square' }
  };
}

function applyPreset(state, presetKey){
  if (!PRESETS[presetKey]) return state;
  const p = PRESETS[presetKey];
  state.preset = presetKey;
  const wasDefaultTitle = Object.values(PRESETS).some(pp => pp.defaults.title.ar === state.headline.title || pp.defaults.title.en === state.headline.title);
  const wasDefaultEyebrow = Object.values(PRESETS).some(pp => pp.defaults.eyebrow.ar === state.profile.eyebrow || pp.defaults.eyebrow.en === state.profile.eyebrow);
  if (wasDefaultTitle || !state.headline.title) state.headline.title = p.defaults.title[state.lang];
  if (wasDefaultEyebrow || !state.profile.eyebrow) state.profile.eyebrow = p.defaults.eyebrow[state.lang];
  return state;
}

function getGroup(state, id){ return state.groups.find(g => g.id === id) || null; }
function getSlot(state, gid, sid){ const g = getGroup(state, gid); return g ? (g.slots.find(s => s.id === sid) || null) : null; }
function getContact(state, id){ return state.contacts.find(c => c.id === id) || null; }

function normalize(raw){
  if (!raw || typeof raw !== 'object' || !Array.isArray(raw.groups)) return null;
  const preset = PRESETS[raw.preset] ? raw.preset : 'tutor';
  const lang = raw.lang === 'en' ? 'en' : 'ar';
  const base = defaultState(preset, lang);
  const str = v => typeof v === 'string' ? v : '';
  return {
    v: 1,
    lang,
    dir: raw.dir === 'ltr' ? 'ltr' : 'rtl',
    numerals: raw.numerals === 'latin' ? 'latin' : 'arabic',
    timeFormat: raw.timeFormat === '12h' ? '12h' : '24h',
    preset,
    theme: THEMES.includes(raw.theme) ? raw.theme : 'classic',
    profile: {
      name: str(raw.profile && raw.profile.name),
      subtitle: str(raw.profile && raw.profile.subtitle),
      eyebrow: (raw.profile && typeof raw.profile.eyebrow === 'string') ? raw.profile.eyebrow : base.profile.eyebrow,
      photo: safePhotoSrc(raw.profile && raw.profile.photo) || null
    },
    headline: {
      title: (raw.headline && typeof raw.headline.title === 'string') ? raw.headline.title : base.headline.title,
      badge: str(raw.headline && raw.headline.badge),
      note: str(raw.headline && raw.headline.note)
    },
    groups: raw.groups.length ? raw.groups.map(g => ({
      id: (g && typeof g.id === 'string') ? g.id : uid(),
      label: str(g && g.label),
      slots: Array.isArray(g && g.slots) ? g.slots.map(s => ({
        id: (s && typeof s.id === 'string') ? s.id : uid(),
        from: (s && typeof s.from === 'string') ? s.from : '09:00',
        to: (s && typeof s.to === 'string') ? s.to : '11:00',
        note: str(s && s.note),
        full: !!(s && s.full)
      })) : []
    })) : base.groups,
    contacts: Array.isArray(raw.contacts) ? raw.contacts.map(c => ({
      id: (c && typeof c.id === 'string') ? c.id : uid(),
      type: CONTACT_TYPES.includes(c && c.type) ? c.type : 'link',
      value: str(c && c.value),
      label: str(c && c.label)
    })) : base.contacts,
    footer: {
      text: str(raw.footer && raw.footer.text),
      showQr: !(raw.footer && raw.footer.showQr === false)
    },
    print: {
      mode: ['poster', 'sheet', 'cards', 'image'].includes(raw.print && raw.print.mode) ? raw.print.mode : 'poster',
      paper: (raw.print && PAPER_MM[raw.print.paper]) ? raw.print.paper : 'A4',
      orientation: (raw.print && raw.print.orientation === 'landscape') ? 'landscape' : 'portrait',
      margin: (raw.print && MARGIN_MM[raw.print.margin]) ? raw.print.margin : 'normal',
      ink: (raw.print && raw.print.ink === 'saver') ? 'saver' : 'color',
      nUp: (raw.print && [2, 4, 8].includes(raw.print.nUp)) ? raw.print.nUp : 4,
      cropMarks: !!(raw.print && raw.print.cropMarks),
      imageSize: (raw.print && raw.print.imageSize === 'story') ? 'story' : 'square'
    }
  };
}

function loadStateFromStorage(){

const EditHistory = {
  stack: [], index: -1,
  _strip(state){
    const clone = JSON.parse(JSON.stringify(state));
    clone.profile.photo = null;
    return JSON.stringify(clone);
  },
  init(state){ this.stack = [this._strip(state)]; this.index = 0; },
  commit(state){
    const snap = this._strip(state);
    if (this.stack[this.index] === snap) return;
    this.stack = this.stack.slice(0, this.index + 1);
    this.stack.push(snap);
    if (this.stack.length > MAX_HISTORY) this.stack.shift(); else this.index++;
    if (this.stack.length > MAX_HISTORY) this.index = this.stack.length - 1;
  },
  canUndo(){ return this.index > 0; },
  canRedo(){ return this.index < this.stack.length - 1; },
  undo(){ if (!this.canUndo()) return null; this.index--; return JSON.parse(this.stack[this.index]); },
  redo(){ if (!this.canRedo()) return null; this.index++; return JSON.parse(this.stack[this.index]); }
};
function applyHistoryState(restored, currentPhoto){
  if (!restored) return null;
  restored.profile.photo = currentPhoto || null;
  return restored;
}

const ARABIC_DIGITS = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
function convertDigits(str, mode){
  str = String(str);
  if (mode === 'arabic') return str.replace(/[0-9]/g, d => ARABIC_DIGITS[+d]);
  return str.replace(/[٠-٩]/g, d => String(ARABIC_DIGITS.indexOf(d)));
}
function formatTime(hhmm, timeFormat, numerals, lang){
  if (!hhmm) return '';
  const m = /^(\d{1,2}):(\d{2})$/.exec(hhmm.trim());
  if (!m) return convertDigits(hhmm, numerals);
  let h = +m[1], min = m[2];
  let suffix = '';
  if (timeFormat === '12h'){
    suffix = h >= 12 ? (lang === 'ar' ? ' م' : ' PM') : (lang === 'ar' ? ' ص' : ' AM');
    h = h % 12; if (h === 0) h = 12;
  }
  const out = `${h}:${min}${suffix}`;
  return convertDigits(out, numerals);
}
function formatTimeRange(from, to, timeFormat, numerals, lang){
  const a = formatTime(from, timeFormat, numerals, lang);
  const b = formatTime(to, timeFormat, numerals, lang);
  if (a && b) return `${a} – ${b}`;
  return a || b || '';
}
function parseTimeInput(raw){
  raw = String(raw || '').trim().replace(/[٠-٩]/g, d => String(ARABIC_DIGITS.indexOf(d)));
  let m = /^([0-1]?[0-9]|2[0-3]):([0-5][0-9])$/.exec(raw);
  if (!m) m = /^([0-1]?[0-9]|2[0-3])[.,]?([0-5][0-9])$/.exec(raw.replace(/\s/g, ''));
  if (!m && /^\d{1,2}$/.test(raw) && +raw <= 23) m = [raw, raw, '00'];
  if (!m) return null;
  return `${String(+m[1]).padStart(2, '0')}:${String(m[2]).padStart(2, '0')}`;
}

  instagram: { ar: 'إنستغرام', en: 'Instagram' },
  telegram: { ar: 'تيليغرام', en: 'Telegram' },
  link: { ar: 'رابط', en: 'Link' }
};
function contactTypeLabel(ty, lang){ return (CONTACT_TYPE_LABELS[ty] || CONTACT_TYPE_LABELS.link)[lang]; }

const CONTACT_TYPES = ['whatsapp', 'phone', 'mail', 'map-pin', 'instagram', 'telegram', 'link'];
function contactIcon(type){ return CONTACT_TYPES.includes(type) ? type : 'link'; }
function contactHref(type, value){
  value = (value || '').trim();
  if (!value) return '';
  switch(type){
    case 'whatsapp': {
      const digits = value.replace(/[^0-9]/g, '');
      return digits ? `https://wa.me/${digits}` : '';
    }
    case 'phone': return `tel:${value.replace(/[^0-9+]/g, '')}`;
    case 'mail': return `mailto:${value}`;
    case 'instagram': return /^https?:/i.test(value) ? value : `https://instagram.com/${value.replace(/^@/, '')}`;
    case 'telegram': return /^https?:/i.test(value) ? value : `https://t.me/${value.replace(/^@/, '')}`;
    case 'map-pin': return /^https?:/i.test(value) ? value : '';
    case 'link': return /^https?:/i.test(value) ? value : `https://${value}`;
    default: return '';
  }
}
function primaryShareUrl(state){
  const wa = state.contacts.find(c => c.type === 'whatsapp' && c.value.trim());
  if (wa) return contactHref('whatsapp', wa.value);
  const withUrl = state.contacts.find(c => contactHref(c.type, c.value));
  if (withUrl) return contactHref(withUrl.type, withUrl.value);
  return '';
}

let state = null;
let focusSnapshot = null;

function setBindValue(state, bindPath, dataset, value){
  if (bindPath === 'profile.name') state.profile.name = value;
  else if (bindPath === 'profile.subtitle') state.profile.subtitle = value;
  else if (bindPath === 'profile.eyebrow') state.profile.eyebrow = value;
  else if (bindPath === 'headline.title') state.headline.title = value;
  else if (bindPath === 'headline.badge') state.headline.badge = value;
  else if (bindPath === 'headline.note') state.headline.note = value;
  else if (bindPath === 'footer.text') state.footer.text = value;
  else if (bindPath === 'group.label'){ const g = getGroup(state, dataset.group); if (g) g.label = value; }
  else if (bindPath === 'slot.note'){ const s = getSlot(state, dataset.group, dataset.slot); if (s) s.note = value; }
  else if (bindPath === 'slot.from'){ const s = getSlot(state, dataset.group, dataset.slot); if (s) s.from = value; }
  else if (bindPath === 'slot.to'){ const s = getSlot(state, dataset.group, dataset.slot); if (s) s.to = value; }
  else if (bindPath === 'contact.value'){ const c = getContact(state, dataset.contact); if (c) c.value = value; }
}

function persistLive(){ saveStateDebounced(state); }
function structuralChange(){
  render(state);
  EditHistory.commit(state);
  saveStateDebounced(state);
  refreshToolbar();
}

const SAFE_PHOTO_RE = /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/]+=*$/;
function safePhotoSrc(photo){
  return (typeof photo === 'string' && SAFE_PHOTO_RE.test(photo)) ? photo : '';
}

function downscaleImage(file, maxDim, cb){
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim){
        if (w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => cb(null);
    img.src = reader.result;
  };
  reader.onerror = () => cb(null);
  reader.readAsDataURL(file);
}

function wireSheetRoot(){
  const root = document.getElementById('sheetRoot');

  root.addEventListener('focusin', e => {
    const el = e.target;
    if (el.matches('[contenteditable="true"]')) focusSnapshot = JSON.stringify(state);
  });

  root.addEventListener('focusout', e => {
    if (isRerendering) return;
    const el = e.target;
    if (!el.matches('[contenteditable="true"]')) return;
    const text = el.textContent.trim();
    el.textContent = text;
    setBindValue(state, el.dataset.bind, el.dataset, text);
    persistLive();
    if (focusSnapshot && focusSnapshot !== JSON.stringify(state)){
      EditHistory.commit(state);
      refreshToolbar();
    }
    focusSnapshot = null;
  });

  root.addEventListener('input', e => {
    const el = e.target;
    if (el.matches('[contenteditable="true"]')){
      setBindValue(state, el.dataset.bind, el.dataset, el.textContent);
      persistLive();
    }
  });

  root.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.target.matches('[contenteditable="true"]') || e.target.matches('.time-input'))){
      e.preventDefault();
      e.target.blur();
    }
  });

  root.addEventListener('paste', e => {
    if (!e.target.matches('[contenteditable="true"]')) return;
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  });

  root.addEventListener('change', e => {
    const el = e.target;
    if (el.matches('.time-input')){
      const s = getSlot(state, el.dataset.group, el.dataset.slot);
      const parsed = parseTimeInput(el.value);
      if (parsed){
        el.value = parsed;
        setBindValue(state, el.dataset.bind, el.dataset, parsed);
        EditHistory.commit(state);
        persistLive();
        refreshToolbar();
      } else if (s){
        el.value = el.dataset.bind === 'slot.from' ? s.from : s.to;
      }
    } else if (el.matches('[data-action="contactType"]')){
      const c = getContact(state, el.dataset.contact);
      if (c) c.type = el.value;
      structuralChange();
    } else if (el.matches('[data-action="uploadPhoto"]')){
      const file = el.files && el.files[0];
      if (!file) return;
      const tooBig = file.size > 900 * 1024;
      downscaleImage(file, 512, dataUrl => {
        if (!dataUrl) return;
        state.profile.photo = dataUrl;
        structuralChange();
        if (tooBig) toast(t('toastImgTooBig'));
      });
    }
  });

  root.addEventListener('click', e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    if (action === 'addGroup'){
      const p = PRESETS[state.preset];
      state.groups.push({ id: uid(), label: (p.defaults.groupLabel[state.lang]) + ' ' + (state.groups.length + 1), slots: [{ id: uid(), from: '09:00', to: '11:00', note: '', full: false }] });
      structuralChange();
    } else if (action === 'removeGroup'){
      state.groups = state.groups.filter(g => g.id !== btn.dataset.group);
      structuralChange();
    } else if (action === 'addSlot'){
      const g = getGroup(state, btn.dataset.group);
      if (g) g.slots.push({ id: uid(), from: '09:00', to: '11:00', note: '', full: false });
      structuralChange();
    } else if (action === 'removeSlot'){
      const g = getGroup(state, btn.dataset.group);
      if (g) g.slots = g.slots.filter(s => s.id !== btn.dataset.slot);
      structuralChange();
    } else if (action === 'toggleFull'){
      const s = getSlot(state, btn.dataset.group, btn.dataset.slot);
      if (s) s.full = !s.full;
      structuralChange();
    } else if (action === 'addContact'){
      state.contacts.push({ id: uid(), type: 'whatsapp', value: '', label: '' });
      structuralChange();
    } else if (action === 'removeContact'){
      state.contacts = state.contacts.filter(c => c.id !== btn.dataset.contact);
      structuralChange();
    } else if (action === 'removePhoto'){
      state.profile.photo = null;
      structuralChange();
    }
  });
}

    for (let col = 0; col < n; col++) {
      for (let row = 0; row < shortLen; row++) {

      }
    }
    let dark = 0;
    for (let row = 0; row < n; row++) for (let col = 0; col < n; col++) if (modules[row][col]) dark++;

    lost += Math.floor(ratio) * 10;
    return lost;

    const bytes = utf8Bytes(text);
    const version = chooseVersion(bytes.length);
    if (!version) throw new Error('Data too long for QR code');
    const data = createData(version, bytes);
    let bestMask = 0, bestLoss = Infinity;
    for (let m = 0; m < 8; m++) {
      const loss = lostPoint(buildMatrix(version, m, data, true));
      if (loss < bestLoss) { bestLoss = loss; bestMask = m; }
    }
    const modules = buildMatrix(version, bestMask, data, false);
    return { version, size: version * 4 + 17, modules, mask: bestMask };
  }

})();

function qrSvg(text){
  if (!text) return '';
  let q;
  try { q = QR.encode(text); } catch(e){ return ''; }
  const quiet = 4;
  const dim = q.size + quiet * 2;
  let rects = '';
  for (let y = 0; y < q.size; y++){
    let x = 0;
    while (x < q.size){
      if (q.modules[y][x]){
        let x2 = x;
        while (x2 < q.size && q.modules[y][x2]) x2++;
        rects += `<rect x="${x + quiet}" y="${y + quiet}" width="${x2 - x}" height="1"/>`;
        x = x2;
      } else x++;
    }
  }
  return `<svg viewBox="0 0 ${dim} ${dim}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect width="${dim}" height="${dim}" fill="#fff"/><g fill="#000">${rects}</g></svg>`;
}

function base64UrlEncode(bytes){
  let binary = '';
  bytes.forEach(b => { binary += String.fromCharCode(b); });
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function base64UrlDecode(str){
  str = str.replace(/-/g, '+').replace(/_/g, '/');
  while (str.length % 4) str += '=';
  const binary = atob(str);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}
async function compressState(state){
  const bytes = new TextEncoder().encode(JSON.stringify(state));
  const cs = new CompressionStream('deflate-raw');
  const writer = cs.writable.getWriter();
  writer.write(bytes); writer.close();
  const buf = await new Response(cs.readable).arrayBuffer();
  return base64UrlEncode(new Uint8Array(buf));
}
async function decompressState(str){
  const bytes = base64UrlDecode(str);
  const ds = new DecompressionStream('deflate-raw');
  const writer = ds.writable.getWriter();
  writer.write(bytes); writer.close();
  const buf = await new Response(ds.readable).arrayBuffer();
  const json = new TextDecoder().decode(buf);
  const normalized = normalize(JSON.parse(json));
  if (normalized) return normalized;
  throw new Error('bad state');
}

const PAPER_MM = {
  A4: { w: 210, h: 297 },
  A5: { w: 148, h: 210 },
  Letter: { w: 215.9, h: 279.4 }
};
const MARGIN_MM = { normal: 14, narrow: 8, none: 0 };

function pageDimsMm(paper, orientation){
  const base = PAPER_MM[paper] || PAPER_MM.A4;
  return orientation === 'landscape' ? { w: base.h, h: base.w } : { w: base.w, h: base.h };
}

function injectPageRules(paper, orientation){
  const dims = pageDimsMm(paper, orientation);
  const styleEl = document.getElementById('pageRules');
  styleEl.textContent = `@page { size: ${dims.w}mm ${dims.h}mm; margin: 0; }`;
}

function fitToPage(scaleTargetEl, measureEl, minScale, maxScale, availableHeightPx){
  let lo = minScale, hi = maxScale, best = minScale;
  for (let i = 0; i < 8; i++){
    const mid = (lo + hi) / 2;
    scaleTargetEl.style.setProperty('--type-scale', mid.toFixed(3));
    const h = measureEl.scrollHeight;
    if (h <= availableHeightPx){ best = mid; lo = mid; }
    else { hi = mid; }
  }
  scaleTargetEl.style.setProperty('--type-scale', best.toFixed(3));
  return best;
}

function makePageEl(state, widthMm, heightMm){
  const el = document.createElement('div');
  el.className = 'pv-page';
  el.dataset.ink = state.print.ink;
  el.dataset.theme = state.theme;
  el.style.width = widthMm + 'mm';
  el.style.height = heightMm + 'mm';
  el.style.setProperty('--pg-margin', MARGIN_MM[state.print.margin] + 'mm');
  el.dir = state.dir;
  el.lang = state.lang;
  return el;
}

function footerStripHtml(state){

}

function posterCardHtml(state){

      <div class="profile-text">

        <span class="profile-subtitle">${escapeHtml(state.profile.subtitle)}</span>
      </div>
    </div>
    <div class="sheet-headline">
      ${state.headline.badge ? `<span class="headline-badge">${escapeHtml(state.headline.badge)}</span>` : ''}
      <span class="headline-title">${escapeHtml(state.headline.title)}</span>
      ${state.headline.note ? `<span class="headline-note">${escapeHtml(state.headline.note)}</span>` : ''}
    </div>
    <div class="sheet-groups">${state.groups.map(g => groupBlockHtml(state, g)).join('')}</div>
    <div class="sheet-contacts">${state.contacts.filter(c=>c.value.trim()).map(c => `
      <span class="contact-chip"><svg class="icon-sm"><use href="#i-${contactIcon(c.type)}"></use></svg><bdi class="tabular">${escapeHtml(c.value)}</bdi></span>

function mountOffscreenForMeasure(el){
  el.style.position = 'fixed';
  el.style.left = '-99999px';
  el.style.top = '0';
  document.body.appendChild(el);
}
function unmountAfterMeasure(el){
  document.body.removeChild(el);
  el.style.position = '';
  el.style.left = '';
  el.style.top = '';
}

function cropMarksSvg(wMm, hMm){
  const m = 4, len = 6;
  const lines = [
    `M${m},0 L${m},${len}`, `M0,${m} L${len},${m}`,
    `M${wMm - m},0 L${wMm - m},${len}`, `M${wMm - len},${m} L${wMm},${m}`,
    `M${m},${hMm - len} L${m},${hMm}`, `M0,${hMm - m} L${len},${hMm - m}`,
    `M${wMm - m},${hMm - len} L${wMm - m},${hMm}`, `M${wMm - len},${hMm - m} L${wMm},${hMm - m}`
  ];
  return `<svg viewBox="0 0 ${wMm} ${hMm}" xmlns="http://www.w3.org/2000/svg" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;">
    <path d="${lines.join(' ')}" stroke="#000" stroke-width=".25" fill="none"/>
  </svg>`;
}

function buildPosterPages(state, dims){
  const page = makePageEl(state, dims.w, dims.h);
  const inner = document.createElement('div');
  inner.className = 'pp-inner pp-poster-body';
  inner.innerHTML = posterCardHtml(state);
  page.appendChild(inner);
  if (state.print.cropMarks) page.insertAdjacentHTML('beforeend', cropMarksSvg(dims.w, dims.h));
  mountOffscreenForMeasure(page);
  const card = inner.querySelector('.sheet-card');
  const marginPx = mmToPx(MARGIN_MM[state.print.margin]);
  const availPx = mmToPx(dims.h) - marginPx * 2;
  fitToPage(inner, card, 0.72, 1.0, availPx);
  unmountAfterMeasure(page);
  return [page];
}

function buildSheetPages(state, dims){
  const marginPx = mmToPx(MARGIN_MM[state.print.margin]);
  const availPx = mmToPx(dims.h) - marginPx * 2;
  const contentWidthPx = mmToPx(dims.w) - marginPx * 2;

  const probe = document.createElement('div');
  probe.className = 'pp-inner pp-sheet-body';
  probe.style.position = 'fixed';
  probe.style.left = '-9999px';
  probe.style.width = contentWidthPx + 'px';
  probe.style.setProperty('--type-scale', '1');
  document.body.appendChild(probe);

  probe.innerHTML = headerStripHtml(state);
  const headerH = probe.scrollHeight;
  probe.innerHTML = footerStripHtml(state);
  const footerH = probe.scrollHeight;

  const groupHeights = state.groups.map(g => {
    probe.innerHTML = groupBlockHtml(state, g);
    return probe.scrollHeight;
  });
  document.body.removeChild(probe);

  const pagesGroups = [];
  let cur = [], curH = headerH + footerH;
  state.groups.forEach((g, i) => {
    const h = groupHeights[i] + 12;
    if (cur.length && curH + h > availPx){ pagesGroups.push(cur); cur = []; curH = headerH + footerH; }
    cur.push(g); curH += h;
  });
  if (cur.length) pagesGroups.push(cur);
  if (!pagesGroups.length) pagesGroups.push([]);

  return pagesGroups.map(groupList => {
    const page = makePageEl(state, dims.w, dims.h);
    const inner = document.createElement('div');
    inner.className = 'pp-inner pp-sheet-body';
    inner.innerHTML = headerStripHtml(state) +
      `<div class="sheet-groups">${groupList.map(g => groupBlockHtml(state, g)).join('')}</div>` +
      footerStripHtml(state);
    page.appendChild(inner);
    return page;
  });
}

function miniCardHtml(state){
  const L = LABELS[state.lang];
  const shareUrl = primaryShareUrl(state);
  const lines = state.groups.map(g => {
    const times = g.slots.map(s => formatTimeRange(s.from, s.to, state.timeFormat, state.numerals, state.lang)).join(' / ');
    return `<div class="mini-line"><b>${escapeHtml(g.label)}</b> <bdi class="tabular">${escapeHtml(times)}</bdi></div>`;
  }).join('');
  const contactLine = state.contacts.find(c => c.value.trim());
  return `
    <div class="mini-name">${escapeHtml(state.profile.name)}</div>
    ${state.profile.subtitle ? `<div class="mini-sub">${escapeHtml(state.profile.subtitle)}</div>` : ''}
    ${lines}
    ${contactLine ? `<div class="mini-line"><bdi class="tabular">${escapeHtml(contactLine.value)}</bdi></div>` : ''}
    ${state.footer.showQr && shareUrl ? `<div class="mini-qr">${qrSvg(shareUrl)}</div>` : ''}
  `;
}

function buildCardsPages(state, dims){
  const n = state.print.nUp;
  const cols = 2;
  const rows = Math.ceil(n / cols);
  const marginPx = mmToPx(MARGIN_MM[state.print.margin]);
  const availH = mmToPx(dims.h) - marginPx * 2;

  const page = makePageEl(state, dims.w, dims.h);
  const inner = document.createElement('div');
  inner.className = 'pp-inner';
  const grid = document.createElement('div');
  grid.className = 'pp-cards-grid';
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  const cellInners = [];
  for (let i = 0; i < n; i++){
    const cell = document.createElement('div');
    cell.className = 'pp-card-cell';
    const cellInner = document.createElement('div');
    cellInner.className = 'pp-card-inner';
    cellInner.innerHTML = miniCardHtml(state);
    cell.appendChild(cellInner);
    grid.appendChild(cell);
    cellInners.push(cellInner);
  }
  inner.appendChild(grid);
  page.appendChild(inner);
  mountOffscreenForMeasure(page);
  const cellPaddingPx = mmToPx(12);
  const cellAvailH = availH / rows - cellPaddingPx;
  fitToPage(grid, cellInners[0], 0.5, 1.3, cellAvailH);
  unmountAfterMeasure(page);
  return [page];
}

function currentDims(){ return pageDimsMm(state.print.paper, state.print.orientation); }

function buildRuler(dims){
  const top = document.getElementById('rulerTop');
  const side = document.getElementById('rulerSide');
  top.innerHTML = ''; side.innerHTML = '';
  top.style.width = dims.w + 'mm';
  side.style.height = dims.h + 'mm';
  for (let mm = 0; mm <= dims.w; mm += 10){
    const major = mm % 50 === 0;
    const tick = document.createElement('div');
    tick.className = 'ruler-tick' + (major ? ' major' : '');
    Object.assign(tick.style, { left: mm + 'mm', bottom: '0', width: '0.6px', height: major ? '5mm' : '2.5mm' });
    top.appendChild(tick);
    if (major && mm > 0){
      const label = document.createElement('div');
      label.className = 'ruler-label';
      Object.assign(label.style, { left: (mm - 3) + 'mm', top: '0' });
      label.textContent = String(mm / 10);
      top.appendChild(label);
    }
  }
  for (let mm = 0; mm <= dims.h; mm += 10){
    const major = mm % 50 === 0;
    const tick = document.createElement('div');
    tick.className = 'ruler-tick' + (major ? ' major' : '');
    tick.style.top = mm + 'mm';
    tick.style.insetInlineEnd = '0';
    tick.style.height = '0.6px';
    tick.style.width = major ? '5mm' : '2.5mm';
    side.appendChild(tick);
  }
}

function updatePreviewFieldVisibility(){
  const mode = state.print.mode;
  const L = LABELS[state.lang];
  document.getElementById('paperField').hidden = mode === 'image';
  document.getElementById('orientationField').hidden = mode === 'image';
  document.getElementById('marginField').hidden = mode === 'image';
  document.getElementById('nUpField').hidden = mode !== 'cards';
  document.getElementById('imageSizeField').hidden = mode !== 'image';
  document.getElementById('bleedField').hidden = mode !== 'poster';
  document.getElementById('commitPrintLabel').textContent = mode === 'image' ? L.downloadImage : L.print;
}

function renderPreview(){
  const dims = currentDims();
  injectPageRules(state.print.paper, state.print.orientation);
  const container = document.getElementById('previewPages');
  container.innerHTML = '';

  if (state.print.mode === 'image'){
    document.getElementById('pvGrid').hidden = true;
    const canvas = document.getElementById('imagePreviewCanvas');
    canvas.hidden = false;
    const size = state.print.imageSize === 'story' ? { w: 1080, h: 1920 } : { w: 1080, h: 1080 };
    drawShareImage(canvas, state, size);
    document.getElementById('pageCountLabel').textContent = '';
    updatePreviewFieldVisibility();
    return;
  }
  document.getElementById('imagePreviewCanvas').hidden = true;
  document.getElementById('pvGrid').hidden = false;

  let pages = [];
  if (state.print.mode === 'poster') pages = buildPosterPages(state, dims);
  else if (state.print.mode === 'sheet') pages = buildSheetPages(state, dims);
  else if (state.print.mode === 'cards') pages = buildCardsPages(state, dims);
  pages.forEach(p => container.appendChild(p));
  buildRuler(dims);

  const L = LABELS[state.lang];
  document.getElementById('pageCountLabel').textContent = L.pageCount(pages.length);
  updatePreviewFieldVisibility();
}

function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight){
  const words = String(text || '').split(' ').filter(Boolean);
  let line = '';
  const lines = [];
  words.forEach(w => {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = w; }
    else line = test;
  });
  if (line) lines.push(line);
  lines.forEach((l, i) => ctx.fillText(l, x, y + i * lineHeight));
  return lines.length;
}

function drawQrToCanvas(ctx, text, x, y, size){
  let q;
  try { q = QR.encode(text); } catch(e){ return; }
  const quiet = 4;
  const dim = q.size + quiet * 2;
  const cell = size / dim;
  ctx.fillStyle = '#fff'; ctx.fillRect(x, y, size, size);
  ctx.fillStyle = '#000';
  for (let ry = 0; ry < q.size; ry++) for (let rx = 0; rx < q.size; rx++){
    if (q.modules[ry][rx]) ctx.fillRect(x + (rx + quiet) * cell, y + (ry + quiet) * cell, cell + 0.5, cell + 0.5);
  }
}

const THEME_RAW = {
  classic: { bg: '#F3EEE7', text: '#2B2620', accent: '#C2603C' },
  modern:  { bg: '#EDF3F1', text: '#122420', accent: '#0B6B5C' },
  gazette: { bg: '#EDE9DD', text: '#231F1B', accent: '#8B1E1E' },
  luxury:  { bg: '#0a0906', text: '#F3EEDF', accent: '#C9A227' }
};

function drawShareImage(canvas, state, size){
  canvas.width = size.w; canvas.height = size.h;
  const ctx = canvas.getContext('2d');
  ctx.direction = state.dir;
  const c = THEME_RAW[state.theme] || THEME_RAW.classic;

  ctx.fillStyle = c.bg; ctx.fillRect(0, 0, size.w, size.h);
  const pad = size.w * 0.1;
  const xCenter = size.w / 2;
  let y = pad + 30;
  ctx.textAlign = 'center';

  if (state.profile.eyebrow){
    ctx.fillStyle = c.accent; ctx.font = '700 26px sans-serif';
    ctx.fillText(state.profile.eyebrow, xCenter, y); y += 56;
  }
  if (state.profile.name){
    ctx.fillStyle = c.text; ctx.font = '700 54px serif';
    y += wrapCanvasText(ctx, state.profile.name, xCenter, y, size.w - pad * 2, 60) * 60 + 20;
  }
  if (state.headline.title){
    ctx.fillStyle = c.accent; ctx.font = '400 30px sans-serif';
    y += wrapCanvasText(ctx, state.headline.title, xCenter, y, size.w - pad * 2, 38) * 38 + 30;
  }
  ctx.fillStyle = c.text; ctx.font = '400 25px sans-serif';
  state.groups.forEach(g => {
    const line = g.label + ':  ' + g.slots.map(s => formatTimeRange(s.from, s.to, state.timeFormat, state.numerals, state.lang)).join(' / ');
    y += wrapCanvasText(ctx, line, xCenter, y, size.w - pad * 2, 34) * 34 + 10;
  });

  const shareUrl = state.footer.showQr ? primaryShareUrl(state) : '';
  if (shareUrl) drawQrToCanvas(ctx, shareUrl, xCenter - 90, size.h - pad - 190, 180);
}

function exportImage(){
  const size = state.print.imageSize === 'story' ? { w: 1080, h: 1920 } : { w: 1080, h: 1080 };
  const canvas = document.getElementById('workCanvas');
  drawShareImage(canvas, state, size);
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'sheet.png';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }, 'image/png');
}

function toast(msg){
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  host.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 2200);
}

function applyI18n(){

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = L[el.dataset.i18n];
    if (typeof v === 'string') el.textContent = v;

  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    const v = L[el.dataset.i18nTitle];
    if (typeof v === 'string') el.title = v;

  document.title = L.appTitle;

function buildThemeSwatches(){

function buildPresetSelect(){

function applyDocAttrs(){

function refreshToolbar(){
  document.getElementById('undoBtn').disabled = !EditHistory.canUndo();
  document.getElementById('redoBtn').disabled = !EditHistory.canRedo();
  document.getElementById('numeralGlyph').textContent = state.numerals === 'arabic' ? '١٢' : '12';

    sw.setAttribute('aria-pressed', sw.dataset.theme === state.theme ? 'true' : 'false')
  );
  buildPresetSelect();
  applyI18n();
  applyDocAttrs();
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function setupManifestAndIcons(){
  try {
    const manifest = {
      name: LABELS[state.lang].appTitle, short_name: LABELS[state.lang].appTitle,
      start_url: '.', display: 'standalone',
      background_color: THEME_RAW.classic.bg, theme_color: THEME_RAW[state.theme].accent,
      icons: []
    };
    const c = document.createElement('canvas');
    c.width = 180; c.height = 180;
    const ctx = c.getContext('2d');
    ctx.fillStyle = THEME_RAW.classic.bg; ctx.fillRect(0, 0, 180, 180);
    ctx.strokeStyle = '#2B2620'; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    roundRect(ctx, 22, 34, 136, 122, 26); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(22, 66); ctx.lineTo(158, 66); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(58, 18); ctx.lineTo(58, 42); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(122, 18); ctx.lineTo(122, 42); ctx.stroke();
    ctx.beginPath(); ctx.arc(90, 118, 28, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(90, 104); ctx.lineTo(90, 118); ctx.lineTo(101, 126); ctx.stroke();
    document.getElementById('appleTouchIcon').setAttribute('href', c.toDataURL('image/png'));

    const manifestJson = JSON.stringify(manifest);
    document.getElementById('manifestLink').setAttribute('href', 'data:application/manifest+json,' + encodeURIComponent(manifestJson));
  } catch(e){ /* manifest/icon generation is a non-critical enhancement */ }
}

function wireToolbar(){
  document.getElementById('themeGroup').addEventListener('click', e => {
    const btn = e.target.closest('.theme-swatch');
    if (!btn) return;
    state.theme = btn.dataset.theme;
    EditHistory.commit(state); persistLive(); refreshToolbar();
  });

  document.getElementById('presetSelect').addEventListener('change', e => {
    applyPreset(state, e.target.value);
    structuralChange();
  });

  document.getElementById('langBtn').addEventListener('click', () => {
    state.lang = state.lang === 'ar' ? 'en' : 'ar';
    state.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
    render(state);
    EditHistory.commit(state); persistLive(); refreshToolbar();
  });

  document.getElementById('numeralBtn').addEventListener('click', () => {
    state.numerals = state.numerals === 'arabic' ? 'latin' : 'arabic';
    EditHistory.commit(state); persistLive(); refreshToolbar();
  });

  document.getElementById('undoBtn').addEventListener('click', () => {
    const s = EditHistory.undo();
    if (s){ state = applyHistoryState(s, state.profile.photo); render(state); saveStateDebounced(state); refreshToolbar(); }
  });
  document.getElementById('redoBtn').addEventListener('click', () => {
    const s = EditHistory.redo();
    if (s){ state = applyHistoryState(s, state.profile.photo); render(state); saveStateDebounced(state); refreshToolbar(); }
  });
  window.addEventListener('keydown', e => {
    const meta = e.ctrlKey || e.metaKey;
    if (meta && e.key.toLowerCase() === 'z'){
      e.preventDefault();
      const s = e.shiftKey ? EditHistory.redo() : EditHistory.undo();
      if (s){ state = applyHistoryState(s, state.profile.photo); render(state); saveStateDebounced(state); refreshToolbar(); }
    } else if (meta && e.key.toLowerCase() === 'y'){
      e.preventDefault();
      const s = EditHistory.redo();
      if (s){ state = applyHistoryState(s, state.profile.photo); render(state); saveStateDebounced(state); refreshToolbar(); }
    }
  });

  document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const normalized = normalize(JSON.parse(reader.result));
        if (!normalized) throw new Error('bad');
        state = normalized;
        EditHistory.init(state);
        render(state); saveStateDebounced(state); refreshToolbar();
        toast(t('toastImported'));
      } catch(err){ toast(t('invalidFile')); }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  document.getElementById('exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'sheet.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  });

  document.getElementById('shareBtn').addEventListener('click', async () => {
    try {
      const shareState = JSON.parse(JSON.stringify(state));
      const hadPhoto = !!shareState.profile.photo;
      shareState.profile.photo = null;
      const compressed = await compressState(shareState);
      const url = location.origin + location.pathname + '#' + compressed;
      if (navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(url);
      } else {
        const ta = document.createElement('textarea');
        ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
      }
      toast(hadPhoto ? LABELS[state.lang].toastShareTooLarge : LABELS[state.lang].toastCopied);
    } catch(e){ toast(t('toastShareFailed')); }
  });

  let lastFocusedBeforeDialog = null;
  function openPrintPreview(){
    lastFocusedBeforeDialog = document.activeElement;
    document.getElementById('printPreview').hidden = false;
    document.getElementById('printModeSelect').value = state.print.mode;
    document.getElementById('paperSelect').value = state.print.paper;
    document.getElementById('orientationSelect').value = state.print.orientation;
    document.getElementById('marginSelect').value = state.print.margin;
    document.getElementById('nUpSelect').value = String(state.print.nUp);
    document.getElementById('imageSizeSelect').value = state.print.imageSize;
    document.getElementById('inkSaverToggle').checked = state.print.ink === 'saver';
    document.getElementById('bleedToggle').checked = !!state.print.cropMarks;
    document.getElementById('showQrToggle').checked = state.footer.showQr;
    document.getElementById('timeFormatToggle').checked = state.timeFormat === '12h';
    renderPreview();
    document.getElementById('closePreviewBtn').focus();
  }
  function closePrintPreview(){
    document.getElementById('printPreview').hidden = true;
    if (lastFocusedBeforeDialog && document.body.contains(lastFocusedBeforeDialog)) lastFocusedBeforeDialog.focus();
    lastFocusedBeforeDialog = null;
  }
  document.getElementById('printBtn').addEventListener('click', openPrintPreview);
  document.getElementById('closePreviewBtn').addEventListener('click', closePrintPreview);
  document.getElementById('printPreview').addEventListener('click', e => {
    if (e.target.id === 'printPreview') closePrintPreview();
  });
  window.addEventListener('keydown', e => {
    const dialog = document.getElementById('printPreview');
    if (dialog.hidden) return;
    if (e.key === 'Escape'){ closePrintPreview(); return; }
    if (e.key === 'Tab'){
      const focusable = Array.from(dialog.querySelectorAll('button, a[href], input, select, textarea, [tabindex]:not([tabindex="-1"])'))
        .filter(el => !el.disabled && el.offsetParent !== null);
      if (!focusable.length) return;
      const first = focusable[0], last = focusable[focusable.length - 1];
      if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
  });

  document.getElementById('startOverBtn').addEventListener('click', () => {
    if (!confirm(LABELS[state.lang].confirmStartOver)) return;
    state = defaultState(state.preset, state.lang);
    EditHistory.init(state);
    render(state); saveStateDebounced(state); refreshToolbar();
    toast(LABELS[state.lang].toastStartOver);
  });

  const pc = id => document.getElementById(id);
  pc('printModeSelect').addEventListener('change', e => { state.print.mode = e.target.value; persistLive(); renderPreview(); });
  pc('paperSelect').addEventListener('change', e => { state.print.paper = e.target.value; persistLive(); renderPreview(); });
  pc('orientationSelect').addEventListener('change', e => { state.print.orientation = e.target.value; persistLive(); renderPreview(); });
  pc('marginSelect').addEventListener('change', e => { state.print.margin = e.target.value; persistLive(); renderPreview(); });
  pc('nUpSelect').addEventListener('change', e => { state.print.nUp = +e.target.value; persistLive(); renderPreview(); });
  pc('imageSizeSelect').addEventListener('change', e => { state.print.imageSize = e.target.value; persistLive(); renderPreview(); });
  pc('inkSaverToggle').addEventListener('change', e => { state.print.ink = e.target.checked ? 'saver' : 'color'; persistLive(); renderPreview(); });
  pc('showQrToggle').addEventListener('change', e => { state.footer.showQr = e.target.checked; EditHistory.commit(state); persistLive(); renderPreview(); });
  pc('timeFormatToggle').addEventListener('change', e => { state.timeFormat = e.target.checked ? '12h' : '24h'; EditHistory.commit(state); persistLive(); renderPreview(); });
  pc('bleedToggle').addEventListener('change', e => { state.print.cropMarks = e.target.checked; persistLive(); renderPreview(); });

  document.getElementById('commitPrintBtn').addEventListener('click', () => {
    if (state.print.mode === 'image') exportImage();
    else window.print();
  });
}

async function init(){
  buildThemeSwatches();
  wireSheetRoot();
  wireToolbar();

  let loaded = null;
  if (location.hash && location.hash.length > 1){
    try { loaded = await decompressState(location.hash.slice(1)); }
    catch(e){ loaded = null; }
  }
  if (!loaded) loaded = loadStateFromStorage();
  if (!loaded) loaded = defaultState('tutor', 'ar');

  state = loaded;
  EditHistory.init(state);
  applyDocAttrs();
  render(state);
  refreshToolbar();
  setupManifestAndIcons();
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
}

function populatePrintMount(){
  const mount = document.getElementById('printMount');
  mount.innerHTML = '';
  const dims = currentDims();
  injectPageRules(state.print.paper, state.print.orientation);
  const mode = state.print.mode === 'image' ? 'poster' : state.print.mode;
  let pages = [];
  if (mode === 'poster') pages = buildPosterPages(state, dims);
  else if (mode === 'sheet') pages = buildSheetPages(state, dims);
  else if (mode === 'cards') pages = buildCardsPages(state, dims);
  pages.forEach(p => mount.appendChild(p));
}
window.addEventListener('beforeprint', populatePrintMount);
window.addEventListener('afterprint', () => { document.getElementById('printMount').innerHTML = ''; });

document.addEventListener('DOMContentLoaded', init);

</script>
</body>
